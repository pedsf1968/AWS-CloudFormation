---
AWSTemplateFormatVersion: "2010-09-09"
Description:  This template deploys a VPC, and Subnets

Parameters:
  # Global parameters
  Bucket:
    Default: "hawkfund-cloudformation"
    Description: CloudFormation buket URL
    Type: String
  BucketKey:
    Default: "K8s_Cluster"
    Description: Key to find object in the bucket
    Type: String
  BucketObject:
    Default: "Data.json"
    Description: "File to store data in the bucket"
    Type: String
  BucketRegion:
    AllowedValues: ["eu-west-3", "eu-central-1"]
    Default: "eu-west-3"
    Description: "Region where is the Bucket"
    Type: String
  EnvironmentName:
    AllowedValues: ["dev", "staging", "test", "prod"]
    ConstraintDescription: "Must specify dev, staging, test or prod"
    Default: "dev"
    Description: "Environment name that prefix all resources"
    Type: String
  ProjectName:
    Default: "ANS"
    Description: "Project name that prefix all resources"
    Type: String
  SaveInS3File:
    AllowedValues: ["false", "true"]
    Default: "false"
    Description: "Save resources information in s3 file"
    Type: String
  
# Stack parameters
  AvailabilityZone:
    Description: "The AZ of the subnet"
    Type: CommaDelimitedList
  PublicSubnetCidrBlocks:
    Default: "10.0.0.0/24"
    Description: "Public subnet CIDRs"
    Type: CommaDelimitedList
  PublicSubnetNames:
    Default: "Bastion"
    Description: "Public subnet names"
    Type: CommaDelimitedList
  SubnetSecureCidrBlocks:
    Default: "10.0.1.0/24"
    Description: "Secure subnet CIDRs"
    Type: CommaDelimitedList
  SubnetSecureNames:
    Default: "Secure"
    Description: "Secure subnet names"
    Type: CommaDelimitedList
  PrivateSubnetCidrBlocks:
    Default: "10.0.2.0/24"
    Description: "Private subnet CIDRs"
    Type: CommaDelimitedList
  PrivateSubnetNames:
    Default: "Cluster"
    Description: "Private subnet names"
    Type: CommaDelimitedList

  VpcCidrBlock:
    Default: 10.0.0.0/16
    Description: "The IPv4 network range for the VPC, in CIDR notation."
    Type: String
  VpcName:
    Default: "K8sVPC"
    Description: VPC name
    Type: String

Resources:
  VpcStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/VPC/Vpc.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        CidrBlock: !Ref VpcCidrBlock
        VpcName: !Ref VpcName

  PublicSubnetStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/VPC/Subnet.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        AvailabilityZone: !Ref AvailabilityZone
        CidrBlock: !Select [ 0, !Ref PublicSubnetCidrBlocks ]
        MapPublicIpOnLaunch: true
        SubnetName: !Select [ 0, !Ref PublicSubnetNames ]
        VpcId: !GetAtt VpcStack.Outputs.VpcId

  PrivateSubnetStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/VPC/Subnet.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        AvailabilityZone: !Ref AvailabilityZone
        CidrBlock: !Select [ 0, !Ref PrivateSubnetCidrBlocks ]
        MapPublicIpOnLaunch: false
        SubnetName: !Select [ 0, !Ref PrivateSubnetNames ]
        VpcId: !GetAtt VpcStack.Outputs.VpcId

  SubnetSecureStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/VPC/Subnet.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        AvailabilityZone: !Ref AvailabilityZone
        CidrBlock: !Select [ 0, !Ref SubnetSecureCidrBlocks ]
        MapPublicIpOnLaunch: false
        SubnetName: !Select [ 0, !Ref SubnetSecureNames ]
        VpcId: !GetAtt VpcStack.Outputs.VpcId

Outputs:
  VpcId:
    Description: "Id of the VPC"
    Value: !GetAtt VpcStack.Outputs.VpcId
  VpcCidrBlock:
    Description: "Cidr of the VPC"
    Value: !GetAtt VpcStack.Outputs.VpcCidrBlock

  PublicSubnetId:
    Description: "Id of the Public Subnet"
    Value: !GetAtt PublicSubnetStack.Outputs.SubnetId
  PublicSubnetCidr:
    Description: "Cidr of the Public Subnet"
    Value: !GetAtt PublicSubnetStack.Outputs.SubnetCidrBlock

  PrivateSubnetIds:
    Description: "Id of the Private Subnets"
    Value: !GetAtt PrivateSubnetStack.Outputs.SubnetId
  PrivateSubnetCidrs:
    Description: "Cidr of the Private Subnets"
    Value: !GetAtt PrivateSubnetStack.Outputs.SubnetCidrBlock

  SubnetSecureIds:
    Description: "Id of the Secure Subnet"
    Value: !GetAtt SubnetSecureStack.Outputs.SubnetId
  SubnetSecureCidrs:
    Description: "Cidr of the Secure Subnets"
    Value: !GetAtt SubnetSecureStack.Outputs.SubnetCidrBlock
