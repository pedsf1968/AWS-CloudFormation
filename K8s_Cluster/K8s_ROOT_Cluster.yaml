# aws cloudformation create-stack --stack-name K8s --template-body file:/K8s_ROOT_Cluster.yaml --region ${BucketRegion} --capabilities CAPABILITY_IAM
# aws cloudformation delete-stack --stack-name K8s --region ${BucketRegion}
# aws cloudformation list-stacks --stack-status-filter @('CREATE_COMPLETE','DELETE_FAILED') --query 'StackSummaries[*].StackName' --output json | ConvertFrom-Json | ForEach-Object { Write-Host $_ ; aws cloudformation delete-stack --stack-name $_}

AWSTemplateFormatVersion: "2010-09-09"
Description: This template create a K8s Cluster

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Project Configuration"
        Parameters:
          - ProjectName
          - EnvironmentName
      - Label:
          default: "Configuration"
        Parameters:
          - BucketRegion
          - Bucket
          - BucketKey
          - BucketObject
          - SaveInS3File
      - Label:
          default: "Network"
        Parameters:
          - VpcCidrBlock
          - VpcName
          - PublicSubnetCidrBlock
          - PublicSubnetName
          - SubnetSecureCidrBlock
          - SubnetSecureName
          - PrivateSubnetCidrBlock
          - PrivateSubnetName
      - Label:
          default: "Instances"
        Parameters:
          - KeyName
          - BastionInstanceImageId
          - BastionInstanceName
          - BastionInstanceType
          - CaServerInstanceImageId
          - CaServerInstanceName
          - CaServerInstanceType
          - ControlplaneImageId
          - ControlplaneName
          - ControlplaneType
          - WorkerImageId
          - WorekerName
          - WorkerType

Parameters:
  # Global parameters
  Bucket:
    Default: "hawkfund-cloudformation"
    Description: CloudFormation buket URL
    Type: String
  BucketKey:
    Default: "K8s_Cluster"
    Description: Key to find object in the bucket
    Type: String
  BucketObject:
    Default: "Data.json"
    Description: "File to store data in the bucket"
    Type: String
  BucketRegion:
    AllowedValues: ["eu-west-3", "eu-central-1"]
    Default: "eu-west-3"
    Description: "Region where is the Bucket"
    Type: String
  EnvironmentName:
    AllowedValues: ["dev", "staging", "test", "prod"]
    ConstraintDescription: "Must specify dev, staging, test or prod"
    Default: "dev"
    Description: "Environment name that prefix all resources"
    Type: String
  ProjectName:
    Default: "K8s"
    Description: "Project name that prefix all resources"
    Type: String
  SaveInS3File:
    AllowedValues: ["false", "true"]
    Default: "false"
    Description: "Save resources information in s3 file"
    Type: String

  # Network parameters
  InternetGatewayName:
    Default: "K8s"
    Type: String
  NatGatewayName:
    Default: "K8s"
    Type: String

  PublicSubnetCidrBlocks:
    Default: "10.0.0.0/24"
    Description: "Public subnet CIDRs"
    Type: String
  PublicSubnetNames:
    Default: "Bastion"
    Description: "Public subnet names"
    Type: String
  SubnetSecureCidrBlocks:
    Default: "10.0.1.0/24"
    Description: "Secure subnet CIDRs"
    Type: String
  SubnetSecureNames:
    Default: "Secure"
    Description: "Secure subnet names"
    Type: String
  PrivateSubnetCidrBlocks:
    Default: "10.0.2.0/24"
    Description: "Private subnet CIDRs"
    Type: String
  PrivateSubnetNames:
    Default: "Cluster"
    Description: "Private subnet names"
    Type: String

  VpcCidrBlock:
    Default: 10.0.0.0/16
    Description: "The IPv4 network range for the VPC, in CIDR notation."
    Type: String
  VpcName:
    Default: "K8sVPC"
    Description: VPC name
    Type: String

  # Instances parameters
  BastionInstanceImageId:
    Default: ami-096dd88190a75cd20
    Description: "Bastion Instance AMI"
    Type: AWS::EC2::Image::Id
  BastionInstanceIngressCidrIp:
    Description: "Ingress CIDR IP for Bastion Instance"
    Default: " 88.188.126.220/32"
    Type: String
  BastionInstanceName:
    Default: "Bastion"
    Description: "Bastion Instance name"
    Type: String
  BastionInstanceType:
    Default: t3a.micro
    Description: "Bastion Instance type"
    Type: String
  CaServerInstanceImageId:
    Default: ami-096dd88190a75cd20
    Description: "CA Server Instance AMI"
    Type: AWS::EC2::Image::Id
  CaServerInstanceName:
    Default: "ca-server"
    Description: "CA Server Instance name"
    Type: String
  CaServerInstanceType:
    Default: t3a.micro
    Description: "CA Instance type"
    Type: String
  ControlplaneImageIds:
    Default: "ami-096dd88190a75cd20,ami-096dd88190a75cd20"
    Description: "ControlPlane and Worker Instances AMIs"
    Type: String
  ControlplaneNames:
    Default: "ControlPlane,Worker"
    Description: "ControlPlane and Worker Instances names"
    Type: String
  ControlplaneTypes:
    Default: "t3a.micro,t3a.micro"
    Description: "ControlPlane and Worker Instances types"
    Type: String
  WorkerImageIds:
    Default: "ami-096dd88190a75cd20,ami-096dd88190a75cd20"
    Description: "ControlPlane and Worker Instances AMIs"
    Type: String
  WorkerNames:
    Default: "ControlPlane,Worker"
    Description: "ControlPlane and Worker Instances names"
    Type: String
  WorkerTypes:
    Default: "t3a.micro,t3a.micro"
    Description: "ControlPlane and Worker Instances types"
    Type: String
  KeyName:
    Default: "dso-paris"
    Description: "Instances Key name"
    Type: String

  RootCaName:
    Default: "root-ca.domain.kr"
    Description: "The name of the CA certificate"
    Type: String

Resources:
  Lambdas:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/${BucketKey}/K8s_Lambdas.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        ApplicationLogLevel: INFO

  Roles:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    DependsOn:
      - Lambdas
    UpdateReplacePolicy: Retain
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/${BucketKey}/K8s_Roles.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File

  VpcAndSubnets:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    DependsOn:
      - Lambdas
    UpdateReplacePolicy: Retain
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/${BucketKey}/K8s_VpcAndSubnets.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        AvailabilityZone: !Select [0, !GetAZs ]
        PrivateSubnetCidrBlocks: !Ref PrivateSubnetCidrBlocks
        PrivateSubnetNames: !Ref PrivateSubnetNames
        PublicSubnetCidrBlocks: !Ref PublicSubnetCidrBlocks
        PublicSubnetNames: !Ref PublicSubnetNames
        SubnetSecureCidrBlocks: !Ref SubnetSecureCidrBlocks
        SubnetSecureNames: !Ref SubnetSecureNames
        VpcCidrBlock: !Ref VpcCidrBlock
        VpcName: !Ref VpcName

  Gateways:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    DependsOn:
      - Roles
      - Lambdas
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/${BucketKey}/K8s_Gateways.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        IgwName: !Ref InternetGatewayName
        NgwName: !Ref NatGatewayName
        PublicSubnetId: !GetAtt VpcAndSubnets.Outputs.PublicSubnetId
        VpcId: !GetAtt VpcAndSubnets.Outputs.VpcId

  RouteTables:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    DependsOn:
      - Lambdas
    UpdateReplacePolicy: Retain
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/${BucketKey}/K8s_RouteTables.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        BucketRegion: !Ref BucketRegion
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        InternetGatewayId: !GetAtt Gateways.Outputs.InternetGatewayId
        NatGatewayId: !GetAtt Gateways.Outputs.NatGatewayId
        RouteTablePrivateNames: "Application,VPNTarget"
        RouteTablePublicName: "Bastion"
        PrivateSubnetIds: !GetAtt VpcAndSubnets.Outputs.PrivateSubnetIds
        PublicSubnetId: !GetAtt VpcAndSubnets.Outputs.PublicSubnetId
        VpcId: !GetAtt VpcAndSubnets.Outputs.VpcId

  SecurityGroups:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    DependsOn:
      - Lambdas
    UpdateReplacePolicy: Retain
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/${BucketKey}/K8s_SecurityGroups.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        BastionInstanceIngressCidrIp: !Ref BastionInstanceIngressCidrIp
        ControlplaneIngressCidrIp: !GetAtt VpcAndSubnets.Outputs.VpcCidrBlock
        WorkerIngressCidrIp: !GetAtt VpcAndSubnets.Outputs.VpcCidrBlock
        VpcId: !GetAtt VpcAndSubnets.Outputs.VpcId

  SsmDocuments:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    DependsOn:
      - Lambdas
    UpdateReplacePolicy: Retain
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/${BucketKey}/K8s_SsmDocuments.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        BucketRegion: !Ref BucketRegion
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName

