---
AWSTemplateFormatVersion: "2010-09-09"
Description: CloudFormation SSM Document template to Create Client certificate with EasyRSA

Parameters:
  # Global parameters
  Bucket:
    AllowedPattern: "^[a-zA-Z0-9_.-]+$"
    Default: "hawkfund-cloudformation"
    Description: CloudFormation bucket URL
    Type: String
  BucketKey:
    AllowedPattern: "^[a-zA-Z0-9_.-]+$"
    Default: "110_AWSClientVpn"
    Description: Key to find object in the bucket
    Type: String
  BucketObject:
    AllowedPattern: "^[a-zA-Z0-9_.-]+$"
    Default: "Data.json"
    Description: "File to store data in the bucket"
    Type: String
  BucketRegion:
    AllowedPattern: "^[a-zA-Z0-9_.-]+$"
    AllowedValues: ["eu-west-3", "eu-central-1"]
    Default: "eu-west-3"
    Description: "Region where is the Bucket"
    Type: String
  EnvironmentName:
    AllowedPattern: "^[a-zA-Z0-9_.-]+$"
    AllowedValues: ["dev", "test", "prod"]
    ConstraintDescription: "Must specify dev, test or prod"
    Default: "dev"
    Description: "Environment name that prefixes all resources"
    Type: String
  ProjectName:
    AllowedPattern: "^[a-zA-Z0-9_.-]+$"
    ConstraintDescription: "Must be 1-20 characters"
    Default: "OpenVPN"
    Description: "Project name that prefixes all resources"
    MinLength: 1
    MaxLength: 20
    Type: String
  SaveInS3File:
    AllowedValues: [ "false", "true" ]
    Default: "false"
    Description: "Save resources information in s3 file"
    Type: String

  # EasyRSA install parameters
  CertificatesDirectory:
    Default: "/opt/certificates"
    Description: "Directory for certificates"
    Type: "String"
  DocumentName:
    AllowedPattern: "^[a-zA-Z0-9_.-]+$"
    ConstraintDescription: "Must contain only alphanumeric characters, hyphens, periods, and underscores"
    Description: "Name of the SSM Document"
    Default: "EasyRsaClientCertificate"
    MaxLength: 64
    MinLength: 3
    Type: String
  InstallDirectory:
    Default: "/opt"
    Description: "Working directory for installation"
    Type: String
  LogDirectory:
    Default: "/var/log/easy-rsa"
    Description: "Log directory path"
    Type: String
  LogFile:
    Default: "easyrsa-client-certificate.log"
    Description: "Log file name"
    Type: String
  Purpose:
    Default: "Create client certificate with EasyRSA"
    Description: Purpose of the Document
    MaxLength: 256
    MinLength: 1
    Type: String

  # Certificate parameters
  ClientBaseName:
    AllowedPattern: "^[a-zA-Z0-9._-]+$"
    ConstraintDescription: "Must contain only alphanumeric characters, periods, hyphens, and underscores"
    Default: "client1"
    Description: "Default client certificate base name"
    MaxLength: 64
    MinLength: 1
    Type: String
  DomainName:
    AllowedPattern: "^[a-zA-Z0-9.-]+$"
    ConstraintDescription: "Must be a valid domain name"
    Default: "domain.kr"
    Description: "Base domain name for certificates"
    MaxLength: 253
    MinLength: 4
    Type: String
  RootCaBaseName:
    AllowedPattern: "^[a-zA-Z0-9_-]+$"
    Default: "ca"
    Description: "Default CA certificate name (no spaces allowed)"
    MaxLength: 64
    MinLength: 1
    Type: String

Conditions:
  SaveInS3File: !Equals [ !Ref SaveInS3File, "true"]

Resources:
  SsmDocument:
    Type: "AWS::SSM::Document"
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}-${DocumentName}"
      DocumentType: "Command"
      DocumentFormat: "YAML"
      TargetType: "/AWS::EC2::Instance"
      UpdateMethod: "Replace"
      Tags:
        - Key: "Environment"
          Value: !Ref EnvironmentName
        - Key: "ManagedBy"
          Value: "CloudFormation"
        - Key: "Project"
          Value: !Ref ProjectName
        - Key: "Purpose"
          Value: !Ref Purpose
        - Key: "StackName"
          Value: !Ref "AWS::StackName"
      Content:
        schemaVersion: "2.2"
        description: "Install and configure OpenVPN EasyRSA with certificate generation and AWS ACM import"
        parameters:
          # Global parameters
          Bucket:
            default: !Ref Bucket
            description: "S3 bucket for certificate storage"
            type: "String"
          BucketKey:
            default: !Ref BucketKey
            description: "S3 bucket key prefix"
            type: "String"
          EnvironmentName:
            default: !Ref EnvironmentName
            description: "Environment name for parameter storage"
            type: "String"
          ProjectName:
            default: !Ref ProjectName
            description: "Project name for parameter storage"
            type: "String"
          StackName:
            default: ""
            description: "CloudFormation Stack Name (optional)"
            type: "String"
          Region:
            default: "{{ global:REGION }}"
            description: "AWS Region for ACM certificate import"
            type: "String"
          ResourceName:
            default: ""
            description: "CloudFormation Resource Name for signaling (optional)"
            type: "String"
          WaitHandleUrl:
            default: ""
            description: "CloudFormation WaitCondition URL (optional)"
            type: "String"

          # EasyRSA install parameters
          CertificatesDirectory:
            default: !Ref CertificatesDirectory
            description: "Directory for certificates"
            type: "String"
          InstallDirectory:
            default: !Ref InstallDirectory
            description: "Working directory for installation"
            type: "String"
          LogDirectory:
            default: !Ref LogDirectory
            description: "Log directory path"
            type: "String"
          LogFile:
            default: !Ref LogFile
            description: "Log file name"
            type: "String"

          # Certificate parameters
          ClientBaseName:
            allowedPattern: "^[a-zA-Z0-9._-]+$"
            default: !Ref ClientBaseName
            description: "Base name for client certificates"
            type: "String"
          DomainName:
            allowedPattern: "^[a-zA-Z0-9.-]+$"
            default: !Ref DomainName
            description: "Base domain name for certificates (e.g., domain.kr)"
            type: "String"
          RootCaBaseName:
            allowedPattern: "^[a-zA-Z0-9\\s._-]+$"
            default: !Ref RootCaBaseName
            description: "Certificate Authority name for OpenVPN"
            type: "String"

        mainSteps:
          - action: "aws:runShellScript"
            name: "createClientCertificate"
            inputs:
              timeoutSeconds: "120"
              runCommand:
                - |
                  #!/bin/bash
                  set -euo pipefail  # Strict error handling

                  # Global parameters
                  readonly BUCKET="{{Bucket}}"
                  readonly BUCKET_KEY="{{BucketKey}}"
                  readonly PROJECT_NAME="{{ProjectName}}"
                  readonly ENVIRONMENT_NAME="{{EnvironmentName}}"
                  readonly WAIT_HANDLE_URL="{{WaitHandleUrl}}"
                  readonly REGION="{{Region}}"
                  readonly RESOURCE_NAME="{{ResourceName}}"
                  readonly STACK_NAME="{{StackName}}"

                  # EasyRSA parameters
                  readonly CERT_DIR="{{CertificatesDirectory}}"
                  readonly INSTALL_DIR="{{InstallDirectory}}"
                  readonly LOG_DIR="{{LogDirectory}}"
                  readonly LOG_FILE="$LOG_DIR/{{LogFile}}"
                  
                  # Certificate parameters
                  readonly CA_BASE_NAME="{{RootCaBaseName}}"
                  readonly CLIENT_BASE_NAME="{{ClientBaseName}}"
                  readonly DOMAIN_NAME="{{DomainName}}"

                  # Construct Certificates FQDN (optional, for better naming)
                  readonly CLIENT_FQDN="${CLIENT_BASE_NAME}.${DOMAIN_NAME}"

                  # Logging function
                  log() {
                      local level="$1"
                      shift
                      echo "[$(date '+%Y-%m-%d %H:%M:%S')] [$level] $*" | tee -a "$LOG_FILE"
                  }

                  # CloudFormation signaling function
                  signal_cloudformation() {
                      local exit_code="$1"
                      local message="$2"
                      local status=$([ "$exit_code" -eq 0 ] && echo "SUCCESS" || echo "FAILURE")
                      
                      log "INFO" "Signaling CloudFormation: Status=$status, Message=$message"
                      
                      if [[ -n "$WAIT_HANDLE_URL" ]]; then
                          log "INFO" "Using WaitCondition URL for signaling"
                          local response_code
                          response_code=$(curl -w "%{http_code}" -s -X PUT \
                              -H 'Content-Type: application/json' \
                              --data-binary "{
                                  \"Status\": \"$status\",
                                  \"Reason\": \"$message\",
                                  \"UniqueId\": \"$(hostname)-$(date +%s)\",
                                  \"Data\": \"EasyRSA client certificate setup completed with exit code $exit_code\"
                              }" \
                              "$WAIT_HANDLE_URL" 2>/dev/null || echo "000")
                          
                          if [[ "$response_code" =~ ^2[0-9][0-9]$ ]]; then
                              log "INFO" "Successfully signaled CloudFormation (HTTP: $response_code)"
                          else
                              log "WARN" "Failed to signal CloudFormation (HTTP: $response_code)"
                          fi
                      elif [[ -n "$STACK_NAME" && -n "$REGION" && -n "$RESOURCE_NAME" ]]; then
                          log "INFO" "Using cfn-signal for CloudFormation signaling"
                          if command -v /opt/aws/bin/cfn-signal >/dev/null 2>&1; then
                              /opt/aws/bin/cfn-signal -e "$exit_code" \
                                  --stack "$STACK_NAME" \
                                  --resource "$RESOURCE_NAME" \
                                  --region "$REGION" || log "WARN" "cfn-signal failed"
                          else
                              log "WARN" "cfn-signal not available"
                          fi
                      else
                          log "INFO" "No CloudFormation signaling configured"
                      fi
                  }

                  # Error handler
                  cleanup_and_exit() {
                      local exit_code=$?
                      local line_number="${1:-unknown}"
                      log "ERROR" "Script failed at line $line_number with exit code $exit_code"
                      signal_cloudformation "$exit_code" "EasyRSA client certificate setup failed at line $line_number"
                      exit "$exit_code"
                  }

                  # Set up error handling
                  trap 'cleanup_and_exit $LINENO' ERR

                  easy_rsa_client_cert() {
                      log "INFO" "Creating client certificate with EasyRSA."
                      log "INFO" "CA name: $CA_NAME"
                      log "INFO" "Client name: $CLIENT_BASE_NAME"
                      log "INFO" "Client FQDN: $CLIENT_FQDN"
                      log "INFO" "Domain: $DOMAIN_NAME"

                      # Create working directory with proper permissions
                      log "INFO" "Creating directories: $WORKING_DIR and $CERT_DIR"
                      mkdir -p "$WORKING_DIR" "$CERT_DIR"

                      # Ensure directories are writable
                      chmod 755 "$WORKING_DIR" "$CERT_DIR"
                      
                      cd "$WORKING_DIR/easy-rsa/easyrsa3"

                      # Verify CA exists
                      if [[ ! -f "pki/ca.crt" ]]; then
                          log "ERROR" "CA certificate not found at pki/ca.crt"
                          log "ERROR" "Please run CA setup first before creating server certificates"
                          return 1
                      fi
                      log "INFO" "CA certificate found, proceeding with server certificate creation"

                      log "INFO" "Client certificate FQDN: $CLIENT_FQDN"

                      # Check if client certificate already exists
                      if [[ -f "pki/issued/${CLIENT_FQDN}.crt" ]]; then
                          log "WARN" "Client certificate ${CLIENT_FQDN} already exists. Removing it to create a new one..."
                          rm -f "pki/issued/${CLIENT_FQDN}.crt"
                          rm -f "pki/private/${CLIENT_FQDN}.key"
                          rm -f "pki/reqs/${CLIENT_FQDN}.req"
                      fi

                      # Build client certificate
                      log "INFO" "Building client certificate..."
                      ./easyrsa --batch build-client-full "$CLIENT_FQDN" nopass
                      
                      # Copy certificates to organized directory
                      log "INFO" "Organizing certificates in ${CERT_DIR}..."
                      cp "pki/issued/${CLIENT_FQDN}.crt" "${CERT_DIR}/"
                      cp "pki/private/${CLIENT_FQDN}.key" "${CERT_DIR}/"
                      
                      # Set proper permissions
                      chmod 600 "${CERT_DIR}/${CLIENT_FQDN}.key"
                      chmod 644 "${CERT_DIR}/${CLIENT_FQDN}.crt"
                      
                      log "INFO" "Certificates created and organized successfully"
                      ls -la "$CERT_DIR/$CLIENT_FQDN.*"
                  }

                  import_to_acm() {
                      log "INFO" "Importing client certificate to AWS Certificate Manager..."
                      
                      cd "$CERT_DIR"

                      local cert_file="${CLIENT_FQDN}.crt"
                      local key_file="${CLIENT_FQDN}.key"
                      local ca_file="ca.crt"

                      # Verify certificate files exist
                      for file in "$cert_file" "$key_file" "$ca_file"; do
                          if [[ ! -f "$file" ]]; then
                              log "ERROR" "Certificate file $file not found in $CERT_DIR"
                              return 1
                          fi
                          local file_size
                          file_size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null || echo "0")
                          log "INFO" "Found certificate file: $file ($file_size bytes)"
                      done

                      # Import certificate to ACM
                      log "INFO" "Importing certificate with FQDN: $CLIENT_FQDN"

                      if ! client_arn=$(aws acm import-certificate \
                          --certificate "fileb://$cert_file" \
                          --private-key "fileb://$key_file" \
                          --certificate-chain "fileb://$ca_file" \
                          --region "$REGION" \
                          --tags \
                              "Key=Name,Value=$CLIENT_FQDN" \
                              "Key=ShortName,Value=$CLIENT_BASE_NAME" \
                              "Key=Domain,Value=$DOMAIN_NAME" \
                              "Key=Project,Value=$PROJECT_NAME" \
                              "Key=Environment,Value=$ENVIRONMENT_NAME" \
                              "Key=Type,Value=Client" \
                              "Key=ManagedBy,Value=CloudFormation" \
                              "Key=CreatedDate,Value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                          --query 'CertificateArn' \
                          --output text 2>&1); then
                          log "ERROR" "Failed to import client certificate: $client_arn"
                          return 1
                      fi

                      # Verify the imported certificate
                      log "INFO" "Verifying imported certificate in ACM..."
                      if aws acm describe-certificate \
                          --certificate-arn "$client_arn" \
                          --region "$REGION" > /dev/null 2>&1; then
                          log "INFO" "Certificate verification in ACM: PASSED"
                      else
                          log "WARN" "Could not verify certificate in ACM"
                      fi

                      log "INFO" "Client certificate imported successfully to ACM"
                      log "INFO" "Certificate ARN: $client_arn"
                      log "INFO" "Certificate FQDN: $CLIENT_FQDN"
                  }

                  store_arn_parameter_store() {
                      log "INFO" "Store ARN to SSM parameter store"

                      cd "$CERT_DIR"

                      # Verify that client_arn is set
                      if [[ -z "$client_arn" ]]; then
                          log "ERROR" "Client ARN is not set, cannot store in Parameter Store"
                          return 1
                      fi

                      # Store ARN with FQDN in path
                      local param_name="/$PROJECT_NAME/$ENVIRONMENT_NAME/certificates/$CLIENT_FQDN/arn"

                      # First, put the parameter
                      if ! aws ssm put-parameter \
                          --name "$param_name" \
                          --value "$client_arn" \
                          --description "ACM Client Certificate ARN for $CLIENT_FQDN" \
                          --type String \
                          --overwrite \
                          --region "$REGION" 2>&1; 
                      then
                          log "INFO" "Client certificate ARN stored in SSM: $param_name"
                          return 1
                      fi

                      # Then, add tags separately
                      log "INFO" "Adding tags to SSM parameter..."
                      if aws ssm add-tags-to-resource \
                          --resource-type Parameter \
                          --resource-id "$param_name" \
                          --tags \
                              "Key=Domain,Value=$DOMAIN_NAME" \
                              "Key=Name,Value=$CLIENT_BASE_NAME" \
                              "Key=FQDN,Value=$CLIENT_FQDN" \
                              "Key=Type,Value=Client" \
                              "Key=Project,Value=$PROJECT_NAME" \
                              "Key=Environment,Value=$ENVIRONMENT_NAME" \
                          --region "$REGION" 2>&1 | tee -a "$LOG_FILE"; then
                          log "INFO" "Tags added to SSM parameter successfully"
                      else
                          log "WARN" "Failed to add tags to SSM parameter (permission may be missing)"
                          log "WARN" "Consider adding ssm:AddTagsToResource permission to the instance role"
                      fi
                  }

                  copy_to_s3() {
                      if [[ -z "$BUCKET" ]]; then
                          log "INFO" "No S3 bucket specified, skipping S3 copy"
                          return 0
                      fi
                      
                      log "INFO" "Copying certificates to S3..."
                      
                      cd "$CERT_DIR"
                      
                      # Copy certificates to S3 with error handling
                      local s3_prefix="s3://$BUCKET/$BUCKET_KEY/certificates/$CLIENT_FQDN"

                      # Copy all certificate files
                      for file in "${CLIENT_FQDN}.crt" "${CLIENT_FQDN}.key" "ca.crt"; do
                          if [[ -f "$file" ]]; then
                              if ! aws s3 cp "$file" "$s3_prefix/$file" \
                                  --region "$REGION" \
                                  --metadata "fqdn=$CLIENT_FQDN,domain=$DOMAIN_NAME,shortname=$CLIENT_BASE_NAME"; then
                                  log "WARN" "Failed to copy $file to S3"
                              else
                                  log "INFO" "Certificate file copied to: $s3_prefix/$file"
                              fi
                          fi
                      done
                  }

                  # Main execution
                  main() {
                      # Create log directory
                      mkdir -p "$LOG_DIR"
                      chmod 755 "$LOG_DIR"

                      log "INFO" "=========================================="
                      log "INFO" "   Starting Client Certificate Creation"
                      log "INFO" "=========================================="
                      log "INFO" "Parameters:"
                      log "INFO" "  Project: $PROJECT_NAME"
                      log "INFO" "  Environment: $ENVIRONMENT_NAME"
                      log "INFO" "  CA Name: $CA_NAME"
                      log "INFO" "  Domain: $DOMAIN_NAME"
                      log "INFO" "  Region: $REGION"
                      log "INFO" "  Install Directory: $INSTALL_DIR"
                      log "INFO" "  Certificates Directory: $CERT_DIR"
                      log "INFO" "  Log Directory: $LOG_DIR"
                      log "INFO" "  Certificate Name: $CLIENT_BASE_NAME"
                      log "INFO" "  Certificate FQDN: $CLIENT_FQDN"
                      log "INFO" "=========================================="

                      # Check if running as root or with sudo
                      if [[ $EUID -ne 0 ]]; then
                          log "WARN" "Not running as root, some operations might fail"
                      fi
                      
                      easy_rsa_client_cert
                      log "INFO" "Client certificate completed successfully"
                      log "INFO" "Certificates stored in: $CERT_DIR"
                      import_to_acm
                      log "INFO" "Certificate imported in ACM"
                      store_arn_parameter_store
                      log "INFO" "Certificate ARN stored in SSM Parameter Store"
                      copy_to_s3
                      log "INFO" "Client certificate ARN stored S3"
                      
                      signal_cloudformation 0 "Client certificate created and imported completed successfully"
                  }

                  # Execute main function
                  main "$@"

  SsmDocumentToS3:
    Type: AWS::CloudFormation::CustomResource
    Condition: SaveInS3File
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ServiceToken: !Join [ ":", [ "arn:aws:lambda", !Sub "${AWS::Region}", !Sub "${AWS::AccountId}", "function:SsmResourceToS3"]]
      ServiceTimeout: 60
      Bucket: !Ref Bucket
      BucketKey: !Ref BucketKey
      BucketObject: !Ref BucketObject
      Region: !Ref AWS::Region
      ResourceType: "Document"
      Key: !Sub "${AWS::Region}:${ProjectName}:${EnvironmentName}:SSM:Document:${DocumentName}"
      Value: !Ref SsmDocument

Outputs:
  SsmDocumentName:
    Description: "Name of the created SSM Document"
    Value: !Ref SsmDocument
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-${DocumentName}-Name"

  SsmDocumentArn:
    Description: "ARN of the created SSM Document"
    Value: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/${SsmDocument}"
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-${DocumentName}-Arn"

  ClientFQDN:
    Description: "Full client FQDN that will be created"
    Value: !Sub "${ClientBaseName}.${DomainName}"
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-ClientFQDN"