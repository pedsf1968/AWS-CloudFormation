---
AWSTemplateFormatVersion: "2010-09-09"
Description: "Fixed CloudFormation template for OpenVPN EasyRSA SSM Document"

Parameters:
  # Global parameters
  Bucket:
    Default: "hawkfund-cloudformation"
    Description: CloudFormation bucket URL
    Type: String
  BucketKey:
    Default: "110_AWSClientVpn"
    Description: Key to find object in the bucket
    Type: String
  EnvironmentName:
    Description: "Environment name that prefixes all resources"
    Type: String
    Default: "dev"
    AllowedValues: ["dev", "test", "prod"]
    ConstraintDescription: "Must specify dev, test or prod"
  ProjectName:
    Description: "Project name that prefixes all resources"
    Type: String
    Default: "OpenVPN"
    MinLength: 1
    MaxLength: 20
    ConstraintDescription: "Must be 1-20 characters"

  # Document Configuration
  DocumentName:
    Description: "Name of the SSM Document"
    Type: String
    Default: "OpenVPNEasyRSAInstaller"
    MinLength: 3
    MaxLength: 64
    AllowedPattern: "^[a-zA-Z0-9_.-]+$"
    ConstraintDescription: "Must contain only alphanumeric characters, hyphens, periods, and underscores"

  DocumentPurpose:
    Description: Purpose of the Document
    Type: String
    Default: "Install OpenVPN EasyRSA and create client certificates"
    MinLength: 1
    MaxLength: 256

  # Certificate Configuration
  DefaultCaName:
    Description: "Default CA certificate name"
    Type: String
    Default: "OpenVPN-CA"
    MinLength: 1
    MaxLength: 64

  DefaultClientBaseName:
    Description: "Default client certificate base name"
    Type: String
    Default: "client1"
    MinLength: 1
    MaxLength: 64

Resources:
  SSMDocument:
    Type: "AWS::SSM::Document"
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}-${DocumentName}"
      DocumentType: "Command"
      DocumentFormat: "YAML"
      TargetType: "/AWS::EC2::Instance"
      UpdateMethod: "Replace"
      Tags:
        - Key: "Environment"
          Value: !Ref EnvironmentName
        - Key: "Project"
          Value: !Ref ProjectName
        - Key: "ManagedBy"
          Value: "CloudFormation"
        - Key: "Purpose"
          Value: !Ref DocumentPurpose
        - Key: "StackName"
          Value: !Ref "AWS::StackName"
      Content:
        schemaVersion: "1.2"
        description: "Install and configure OpenVPN EasyRSA with certificate generation and AWS ACM import"
        parameters:
          CaName:
            type: "String"
            description: "Certificate Authority name for OpenVPN"
            default: !Ref DefaultCaName
            allowedPattern: "^[a-zA-Z0-9\\s._-]+$"
          ClientBaseName:
            type: "String"
            description: "Base name for client certificates"
            default: !Ref DefaultClientBaseName
            allowedPattern: "^[a-zA-Z0-9._-]+$"
          Region:
            type: "String"
            description: "AWS Region for ACM certificate import"
            default: "{{ global:REGION }}"
          ProjectName:
            type: "String"
            description: "Project name for parameter storage"
            default: !Ref ProjectName
          EnvironmentName:
            type: "String"
            description: "Environment name for parameter storage"
            default: !Ref EnvironmentName
          Bucket:
            type: "String"
            description: "S3 bucket for certificate storage"
            default: !Ref Bucket
          BucketKey:
            type: "String"
            description: "S3 bucket key prefix"
            default: !Ref BucketKey
          WaitHandleUrl:
            type: "String"
            description: "CloudFormation WaitCondition URL (optional)"
            default: ""
          StackName:
            type: "String"
            description: "CloudFormation Stack Name (optional)"
            default: ""
          ResourceName:
            type: "String"
            description: "CloudFormation Resource Name for signaling (optional)"
            default: ""
          InstallDirectory:
            type: "String"
            description: "Working directory for installation"
            default: "~/openvpn-setup"
          CertificatesDirectory:
            type: "String"
            description: "Directory for certificates"
            default: "~/certificates"
        runtimeConfig:
          "aws:runShellScript":
            properties:
              - id: "0.aws:runShellScript"
                timeoutSeconds: 300
                runCommand:
                  - |
                    #!/bin/bash
                    set -euo pipefail  # Strict error handling

                    # Variables
                    readonly BUCKET="{{Bucket}}"
                    readonly BUCKET_KEY="{{BucketKey}}"
                    readonly PROJECT_NAME="{{ProjectName}}"
                    readonly ENVIRONMENT_NAME="{{EnvironmentName}}"
                    readonly WAIT_HANDLE_URL="{{WaitHandleUrl}}"
                    readonly STACK_NAME="{{StackName}}"
                    readonly REGION="{{Region}}"
                    readonly RESOURCE_NAME="{{ResourceName}}"
                    readonly CA_NAME="{{CaName}}"
                    readonly CLIENT_BASE_NAME="{{ClientBaseName}}"
                    readonly WORKING_DIR="{{InstallDirectory}}"
                    readonly LOG_FILE="/var/log/openvpn-easyrsa-install.log"
                    readonly CERT_DIR="{{CertificatesDirectory}}"

                    # Logging function
                    log() {
                        local level="$1"
                        shift
                        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [$level] $*" | tee -a "$LOG_FILE"
                    }

                    # CloudFormation signaling function
                    signal_cloudformation() {
                        local exit_code="$1"
                        local message="$2"
                        local status=$([ "$exit_code" -eq 0 ] && echo "SUCCESS" || echo "FAILURE")
                        
                        log "INFO" "Signaling CloudFormation: Status=$status, Message=$message"
                        
                        if [[ -n "$WAIT_HANDLE_URL" ]]; then
                            log "INFO" "Using WaitCondition URL for signaling"
                            local response_code
                            response_code=$(curl -w "%{http_code}" -s -X PUT \
                                -H 'Content-Type: application/json' \
                                --data-binary "{
                                    \"Status\": \"$status\",
                                    \"Reason\": \"$message\",
                                    \"UniqueId\": \"$(hostname)-$(date +%s)\",
                                    \"Data\": \"OpenVPN EasyRSA setup completed with exit code $exit_code\"
                                }" \
                                "$WAIT_HANDLE_URL" 2>/dev/null || echo "000")
                            
                            if [[ "$response_code" =~ ^2[0-9][0-9]$ ]]; then
                                log "INFO" "Successfully signaled CloudFormation (HTTP: $response_code)"
                            else
                                log "WARN" "Failed to signal CloudFormation (HTTP: $response_code)"
                            fi
                        elif [[ -n "$STACK_NAME" && -n "$REGION" && -n "$RESOURCE_NAME" ]]; then
                            log "INFO" "Using cfn-signal for CloudFormation signaling"
                            if command -v /opt/aws/bin/cfn-signal >/dev/null 2>&1; then
                                /opt/aws/bin/cfn-signal -e "$exit_code" \
                                    --stack "$STACK_NAME" \
                                    --resource "$RESOURCE_NAME" \
                                    --region "$REGION" || log "WARN" "cfn-signal failed"
                            else
                                log "WARN" "cfn-signal not available"
                            fi
                        else
                            log "INFO" "No CloudFormation signaling configured"
                        fi
                    }

                    # Error handler
                    cleanup_and_exit() {
                        local exit_code=$?
                        local line_number="${1:-unknown}"
                        log "ERROR" "Script failed at line $line_number with exit code $exit_code"
                        signal_cloudformation "$exit_code" "OpenVPN EasyRSA setup failed at line $line_number"
                        exit "$exit_code"
                    }

                    # Set up error handling
                    trap 'cleanup_and_exit $LINENO' ERR

                    # Main installation function
                    install_dependencies() {
                        log "INFO" "Installing dependencies..."
                        
                        if command -v yum >/dev/null 2>&1; then
                            log "INFO" "Detected RHEL/Amazon Linux - using yum"
                            yum update -y
                            yum install -y git awscli
                        elif command -v apt-get >/dev/null 2>&1; then
                            log "INFO" "Detected Ubuntu/Debian - using apt"
                            export DEBIAN_FRONTEND=noninteractive
                            apt-get update -y
                            apt-get install -y git awscli
                        else
                            log "ERROR" "Unsupported package manager"
                            return 1
                        fi
                        
                        # Verify AWS CLI is available
                        if ! command -v aws >/dev/null 2>&1; then
                            log "ERROR" "AWS CLI not available after installation"
                            return 1
                        fi
                    }

                    setup_easy_rsa() {
                        log "INFO" "Setting up EasyRSA..."
                        
                        # Create working directory
                        mkdir -p "$WORKING_DIR" "$CERT_DIR"
                        cd "$WORKING_DIR"
                        
                        # Clone EasyRSA
                        if [[ -d "easy-rsa" ]]; then
                            log "INFO" "EasyRSA directory exists, removing..."
                            rm -rf easy-rsa
                        fi
                        
                        log "INFO" "Cloning EasyRSA repository..."
                        git clone --depth 1 https://github.com/OpenVPN/easy-rsa.git
                        cd easy-rsa/easyrsa3
                        
                        # Initialize PKI
                        log "INFO" "Initializing PKI..."
                        ./easyrsa init-pki
                        
                        # Build CA
                        log "INFO" "Building CA certificate..."
                        ./easyrsa --batch build-ca nopass <<< "$CA_NAME"
                        
                        # Build server certificate
                        log "INFO" "Building server certificate..."
                        ./easyrsa --batch --san=DNS:server build-server-full server nopass
                        
                        # Build client certificate
                        log "INFO" "Building client certificate..."
                        ./easyrsa --batch build-client-full "$CLIENT_BASE_NAME" nopass
                        
                        # Copy certificates to organized directory
                        log "INFO" "Organizing certificates..."
                        cp pki/ca.crt "$CERT_DIR/"
                        cp pki/issued/server.crt "$CERT_DIR/"
                        cp pki/private/server.key "$CERT_DIR/"
                        cp pki/issued/"$CLIENT_BASE_NAME.crt" "$CERT_DIR/"
                        cp pki/private/"$CLIENT_BASE_NAME.key" "$CERT_DIR/"
                        
                        # Set proper permissions
                        chmod 600 "$CERT_DIR"/*.key
                        chmod 644 "$CERT_DIR"/*.crt
                    }

                    import_to_acm() {
                        log "INFO" "Importing server certificate to AWS Certificate Manager..."
                        
                        cd "$CERT_DIR"
                        
                        local server_arn
                        if ! server_arn=$(aws acm import-certificate \
                            --certificate fileb://server.crt \
                            --private-key fileb://server.key \
                            --certificate-chain fileb://ca.crt \
                            --region "$REGION" \
                            --query 'CertificateArn' \
                            --output text 2>&1); then
                            log "ERROR" "Failed to import server certificate: $server_arn"
                            return 1
                        fi
                        
                        log "INFO" "Server certificate imported: $server_arn"
                        
                        # Store ARN for reference - Now using correct variable names
                        if ! aws ssm put-parameter \
                            --name "/$PROJECT_NAME/$ENVIRONMENT_NAME/certificates/server-arn" \
                            --value "$server_arn" \
                            --type String \
                            --overwrite \
                            --region "$REGION" 2>&1; then
                            log "WARN" "Failed to store server certificate ARN in SSM Parameter Store"
                        else
                            log "INFO" "Server certificate ARN stored in SSM: /$PROJECT_NAME/$ENVIRONMENT_NAME/certificates/server-arn"
                        fi
                    }

                    copy_to_s3() {
                        if [[ -z "$BUCKET" ]]; then
                            log "INFO" "No S3 bucket specified, skipping S3 copy"
                            return 0
                        fi
                        
                        log "INFO" "Copying certificates to S3..."
                        
                        cd "$CERT_DIR"
                        
                        # Copy certificates to S3 with error handling
                        local s3_prefix="s3://$BUCKET/$BUCKET_KEY"
                        
                        if ! aws s3 cp server.crt "$s3_prefix/server.crt" --region "$REGION"; then
                            log "WARN" "Failed to copy server certificate to S3"
                        else
                            log "INFO" "Server certificate copied to: $s3_prefix/server.crt"
                        fi
                        
                        if ! aws s3 cp "$CLIENT_BASE_NAME.crt" "$s3_prefix/$CLIENT_BASE_NAME.crt" --region "$REGION"; then
                            log "WARN" "Failed to copy client certificate to S3"
                        else
                            log "INFO" "Client certificate copied to: $s3_prefix/$CLIENT_BASE_NAME.crt"
                        fi
                        
                        if ! aws s3 cp ca.crt "$s3_prefix/ca.crt" --region "$REGION"; then
                            log "WARN" "Failed to copy CA certificate to S3"
                        else
                            log "INFO" "CA certificate copied to: $s3_prefix/ca.crt"
                        fi
                    }

                    # Main execution
                    main() {
                        log "INFO" "Starting OpenVPN EasyRSA installation..."
                        log "INFO" "Parameters: Project=$PROJECT_NAME, Environment=$ENVIRONMENT_NAME"
                        log "INFO" "Certificate details: CA=$CA_NAME, Client=$CLIENT_BASE_NAME, Region=$REGION"
                        
                        # Check if running as root or with sudo
                        if [[ $EUID -ne 0 ]]; then
                            log "WARN" "Not running as root, some operations might fail"
                        fi
                        
                        install_dependencies
                        setup_easy_rsa
                        import_to_acm
                        copy_to_s3
                        
                        log "INFO" "OpenVPN EasyRSA installation completed successfully"
                        log "INFO" "Certificates stored in: $CERT_DIR"
                        log "INFO" "Server certificate ARN stored in SSM Parameter Store"
                        
                        signal_cloudformation 0 "OpenVPN EasyRSA installation and certificate import completed successfully"
                    }

                    # Execute main function
                    main "$@"

Outputs:
  SSMDocumentName:
    Description: "Name of the created SSM Document"
    Value: !Ref SSMDocument
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-${DocumentName}-Name"

  SSMDocumentArn:
    Description: "ARN of the created SSM Document"
    Value: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/${SSMDocument}"
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-${DocumentName}-Arn"

  DocumentExecutionCommand:
    Description: "AWS CLI command to execute the document"
    Value: !Sub |
      aws ssm send-command \
        --document-name "${SSMDocument}" \
        --instance-ids "i-1234567890abcdef0" \
        --parameters "CaName=MyCA,ClientBaseName=client1,Region=${AWS::Region},ProjectName=${ProjectName},EnvironmentName=${EnvironmentName},Bucket=${Bucket},BucketKey=${BucketKey}"
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-${DocumentName}-ExecutionCommand"