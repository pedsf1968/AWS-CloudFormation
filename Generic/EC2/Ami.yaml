AWSTemplateFormatVersion: "2010-09-09"
Description: "Create an AMI from an EC2 instance."

Parameters:
  # Global parameters
  Bucket:
    Default: "hawkfund-cloudformation"
    Description: CloudFormation buket URL
    Type: String
  BucketKey:
    Default: "64_VPCEndpointServiceAndAccessThroughVPCEndpoint"
    Description: Key to find object in the bucket
    Type: String
  BucketObject:
    Default: "Data.json"
    Description: "File to store data in the bucket"
    Type: String
  EnvironmentName:
    AllowedValues: ["dev", "test", "staging", "prod"]
    ConstraintDescription: "Must specify dev, test or prod"
    Default: "dev"
    Description: "Environment name that prefix all resources"
    Type: String    
  ProjectName:
    Default: "ANS"
    Description: "Project name that prefix all resources"
    Type: String

  # Stack parameters
  AmiName:
    Default: ""
    Description: Name of the AMI to create
    Type: String
  ApplicationLogLevel:
    AllowedValues: [ TRACE, DEBUG, INFO, WARN, ERROR, FATAL ]
    Default: DEBUG
    Description: |
      Set this property to filter the application logs for your function that Lambda sends to CloudWatch. 
      Lambda only sends application logs at the selected level of detail and lower, 
      where TRACE is the highest level and FATAL is the lowest.
    Type: String
  AssociatePublicIpAddress:
    AllowedValues:
      - "false"
      - "true"
    Default: "false"
    Description: >-
      Indicates whether to assign a public IPv4 address to an instance. Applies
      only if creating a network interface when launching an instance. The
      network interface must be the primary network interface. If launching
      into a default subnet, the default value is true.
    Type: String
  AvailabilityZone: # Required: No
    Description: >-
      The Availability Zone of the instance. If not specified, an Availability
      Zone will be automatically chosen for you based on the load balancing
      criteria for the Region. This parameter is not supported by
      DescribeImageAttribute.
    Type: String
  ElasticIP:
    AllowedValues:
      - "false"
      - "true"
    Default: "false"
    Description: "Create elastic IP for the instance"
    Type: String
  IamInstanceProfile: # Required: No
    Default: ""
    Description: >-
      The name of an IAM instance profile. To create a new IAM instance profile,
      use the AWS::IAM::InstanceProfile resource.
    Type: String
  ImageId: # Required: Conditional
    Default: ami-096dd88190a75cd20
    Description: >-
      The ID of the AMI. An AMI ID is required to launch an instance and must
      be specified here or in a launch template.
    Type: AWS::EC2::Image::Id
  InstanceName:
    Description: "Instance name"
    Type: String
  InstanceType: # Required: No
    AllowedValues:
      - t3a.micro
      - t2.small
      - t2.large
    Default: t3a.micro
    Description: >-
      The instance type. For more information, see Instance types in the Amazon
      EC2 User Guide. When you change your EBS-backed instance type, instance
      restart or replacement behavior depends on the instance type
      compatibility between the old and new types. An instance with an instance
      store volume as the root volume is always replaced. For more information,
      see Change the instance type in the Amazon EC2 User Guide.
    Type: String
  KeyName: # Required: No
    Default: "dso-paris"
    Description: >-
      The name of the key pair. You can create a key pair using CreateKeyPair
      or ImportKeyPair.
    Type: String
  SecurityGroupIds: # Required: Conditional
    Default: ""
    Description: >-
      The IDs of the security groups. You can specify the IDs of existing
      security groups and references to resources created by the stack
      template. If you specify a network interface, you must specify any
      security groups as part of the network interface.
    Type: CommaDelimitedList
  SourceDestCheck: # Required: No
    AllowedValues:
      - "false"
      - "true"
    Default: "true"
    Description: >-
      Enable or disable source/destination checks, which ensure that the
      instance is either the source or the destination of any traffic that it
      receives. If the value is true, source/destination checks are enabled;
      otherwise, they are disabled. The default value is true. You must
      disable source/destination checks if the instance runs services such as
      network address translation, routing, or firewalls.
    Type: String
  SubnetId: # Required: No
    Description: >-
      The ID of the subnet to launch the instance into. If you specify a
      network interface, you must specify any subnets as part of the network
      interface instead of using this parameter.
    Type: String
  SSMDocumentName:
    Description: SSM Document to be executed on instance before creating AMI
    Type: String
  UserData: # Required: No
    Default: ""
    Description: >-
      The parameters or scripts to store as user data. Any scripts in user data
      are run when you launch the instance. User data is limited to 16 KB. You
      must provide base64-encoded text. For more information, see Fn::Base64.
      If the root volume is an EBS volume and you update user data,
      CloudFormation restarts the instance. If the root volume is an instance
      store volume and you update user data, the instance is replaced.
    Type: String

Conditions:
  hasElasticIP: !Equals [!Ref ElasticIP, "true"]
  hasNoUserData: !Equals [!Ref UserData, ""]
  hasNoAmiName: !Equals [!Ref AmiName, ""]

Resources:
  # Create all needed Lambda
  CreateAmiFromInstanceIdStack: # Lambda to create AMI from Instance
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        ApplicationLogLevel: !Ref ApplicationLogLevel
      TemplateURL: !Sub "https://${Bucket}.s3.eu-west-3.amazonaws.com/Generic/Lambda/CreateAmiFromInstanceId.yaml"
      TimeoutInMinutes: 5

  CheckSsmExecutionCompleteStack: # Lambda to check the execution of SSM Association
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        ApplicationLogLevel: !Ref ApplicationLogLevel
      TemplateURL: !Sub "https://${Bucket}.s3.eu-west-3.amazonaws.com/Generic/Lambda/CheckSsmExecutionComplete.yaml"
      TimeoutInMinutes: 5

  # Create base instance
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      AvailabilityZone: !Ref AvailabilityZone
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref IamInstanceProfile
      KeyName: !Ref KeyName
      # Network interfaces with security groups specified within
      NetworkInterfaces:
        - DeviceIndex: 0
          SubnetId: !Ref SubnetId
          AssociatePublicIpAddress: true
          DeleteOnTermination: true
          GroupSet: !Ref SecurityGroupIds
      # Remove the separate SecurityGroupIds property
      SourceDestCheck: !Ref SourceDestCheck
      Tags:
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: "CloudFormation"
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-${InstanceName}"
        - Key: ProjectName
          Value: !Ref ProjectName
        - Key: StackName
          Value: !Ref AWS::StackName
      UserData: !If
        - hasNoUserData
        - !Base64 |
          #!/bin/bash
          if grep -q "amzn" /etc/os-release; then
            yum update -y
            amazon-linux-extras install -y aws-ssm-agent
          elif grep -q "Ubuntu" /etc/os-release; then
            apt update -y
            apt install -y aws-ssm-agent
          elif grep -q "CentOS" /etc/os-release || grep -q "Red Hat" /etc/os-release; then
            yum update -y
            yum install -y amazon-ssm-agent
          fi
          systemctl enable amazon-ssm-agent
          systemctl start amazon-ssm-agent
        - !Ref UserData

  # Wait condition handle for Apache installation
  SSMAssociationWaitHandle:
    Type: AWS::CloudFormation::WaitConditionHandle

  # Wait condition for Apache installation completion
  SSMAssociationWaitCondition:
    Type: AWS::CloudFormation::WaitCondition
    DependsOn: 
      - SSMAssociation
    Properties:
      Count: 1
      Handle: !Ref SSMAssociationWaitHandle
      Timeout: 1800  # 30 minutes - should match or exceed SSM association timeout

  # Apply SSM Document to the instance
  SSMAssociation:
    Type: AWS::SSM::Association
    Properties:
      Name: !Ref SSMDocumentName
      Parameters:
        Message: 
          - "Instance behind a Load Balancer"
        WaitHandleUrl:
          - !Ref SSMAssociationWaitHandle
        StackName:
          - !Ref AWS::StackName
        Region:
          - !Ref AWS::Region
        ResourceName:
          - "SSMAssociationWaitCondition"
      Targets:
        - Key: InstanceIds
          Values:
          - !Ref Instance
      # FIXED: Use a simpler, compliant association name format
      AssociationName: !Sub "${ProjectName}-${EnvironmentName}-${SSMDocumentName}"
      WaitForSuccessTimeoutSeconds: 1200  # 20 minutes
      MaxConcurrency: "1"
      MaxErrors: "0"

  # Check the completion of the SSM application
  CheckSsmExecutionComplete:
    Type: AWS::CloudFormation::CustomResource
    DependsOn:
      - CheckSsmExecutionCompleteStack
      - SSMAssociationWaitCondition  # ✅ Add this dependency
    Properties:
      ServiceToken: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:CheckSsmExecutionComplete"
      AssociationId: !Ref SSMAssociation
      InstanceId: !Ref Instance
      MaxWaitTimeMinutes: 10

  # Create AMI
  CreateAmi:
    Type: AWS::CloudFormation::CustomResource
    DeletionPolicy: Retain
    DependsOn:
      - CheckSsmExecutionComplete
    UpdateReplacePolicy: Retain
    Properties:
      ServiceToken: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:CreateAmiFromInstanceId"
      InstanceId: !Ref Instance
      Name: !If
        - hasNoAmiName
        - !Sub "${SSMDocumentName}-AMI"
        - !Ref AmiName

Outputs:
  ImageId:
    Value: !GetAtt CreateAmi.ImageId