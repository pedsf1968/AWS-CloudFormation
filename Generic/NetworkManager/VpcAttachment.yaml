---

AWSTemplateFormatVersion: "2010-09-09"
Description: Creates a VPC attachment on an edge location of a core network.

Parameters:
  # Global parameters
  Bucket:
    Default: "hawkfund-cloudformation"
    Description: CloudFormation buket URL
    Type: String
  BucketKey:
    Default: "150_AWSCloudWANNetwork"
    Description: Key to find object in the bucket
    Type: String
  BucketObject:
    Default: "Data.json"
    Description: "File to store data in the bucket"
    Type: String
  EnvironmentName:
    AllowedValues: ["dev", "test", "staging", "prod"]
    ConstraintDescription: "Must specify dev, test or prod"
    Default: "dev"
    Description: "Environment name that prefix all resources"
    Type: String    
  ProjectName:
    Default: "ANS"
    Description: "Project name that prefix all resources"
    Type: String
  SaveInS3File:
    AllowedValues: [ "false", "true" ]
    Default: "true"
    Description: "Save resources information in s3 file"
    Type: String

  # Stack parameters
  CoreNetworkId:
    Description: "Core Network ID"
    Type: String
  VpcId:
    Description: "VPC ID to attach to the core network"
    Type: String
  SubnetArns:
    Description: "Comma-separated list of subnet ARNs to attach to the core network"
    Type: CommaDelimitedList
  Name:
    Default: "Global-Network"
    Description: "Global Network name"
    Type: String
  TagKeyAttachment:
    Default: "Environment"
    Description: "Key allowed auto attachment"
    Type: String
  TagValueAttachment:
    Default: "Development"
    Description: "Value allowed auto attachment"
    Type: String

Conditions:
  SaveInS3File: !Equals [ !Ref SaveInS3File, "true"]

Resources:

  VpcAttachment:
    Type: AWS::NetworkManager::VpcAttachment

    Properties:
      CoreNetworkId: !Ref CoreNetworkId

      VpcArn: !Sub
        - arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/${VpcId}
        - VpcId: !Ref VpcId

      SubnetArns: !Ref SubnetArns

      Options:
        DnsSupport: true
        Ipv6Support: false
        ApplianceModeSupport: false
        SecurityGroupReferencingSupport: true

      Tags:
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-${Name}" 
        - Key: ManagedBy
          Value: "CloudFormation"
        - Key: ProjectName
          Value: !Ref ProjectName
        - Key: !Ref TagKeyAttachment
          Value: !Ref TagValueAttachment
        - Key: StackName
          Value: !Ref AWS::StackName

  VpcAttachmentToS3:
    Type: AWS::CloudFormation::CustomResource
    Condition: SaveInS3File
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ServiceToken: !Join [ ":", [ "arn:aws:lambda", !Sub "${AWS::Region}", !Sub "${AWS::AccountId}", "function:NetworkManagerResourceToS3"]]
      ServiceTimeout: 60
      Bucket: !Ref Bucket
      BucketKey: !Ref BucketKey
      BucketObject: !Ref BucketObject
      Region: !Ref AWS::Region
      ResourceType: "VpcAttachment"
      Key: !Sub "${AWS::Region}:${ProjectName}:${EnvironmentName}:NetworkManager:VpcAttachment:${Name}"
      Value: !Ref VpcAttachment

Outputs:
  VpcAttachmentId:
    Description: "Vpc Attachment ID"
    Value: !Ref VpcAttachment
  ResourceArn:
    Description: "Vpc Attachment ARN"
    Value: !GetAtt VpcAttachment.ResourceArn