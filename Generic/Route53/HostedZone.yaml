---
AWSTemplateFormatVersion: "2010-09-09"
Description:  "Generic template to deploy HostedZone"

Parameters:
  # Global parameters
  Bucket:
    Default: "hawkfund-cloudformation"
    Description: CloudFormation buket URL
    Type: String
  BucketKey:
    Default: ""
    Description: Key to find object in the bucket
    Type: String
  BucketObject:
    Default: "Data.json"
    Description: "File to store data in the bucket"
    Type: String
  EnvironmentName:
    AllowedValues: ["dev", "test", "staging", "prod"]
    ConstraintDescription: "Must specify dev, test or prod"
    Default: "dev"
    Description: "Environment name that prefix all resources"
    Type: String    
  ProjectName:
    Default: "ANS"
    Description: "Project name that prefix all resources"
    Type: String
  SaveInS3File:
    AllowedValues: [ "false", "true" ]
    Default: "false"
    Description: "Save resources information in s3 file"
    Type: String

  # Stack parameters
  Comment:
    Default: ""
    Description: >-
      Optional: The comment of the hosted zone.
    MaxLength: 256
    Type: String
  Name:
    Default: "corp.internal"
    Description: >-
      Optional: The name of the domain. This should be a fully qualified
      domain, such as www.example.com. The trailing dot is not required.
    Type: String
    MaxLength: 1024
  VpcIds:
    Default: ""
    Description: >-
      Optional: The list of VPCs that you want to associate with this hosted
      zone. Note that the VPCs and the hosted zone must already be associated
      or disassociated for the update to succeed.
    Type: CommaDelimitedList
  VpcRegions:
    Default: ""
    Description: >-
      Optional: Private hosted zones: A complex type that contains information
      about the VPCs that are associated with the specified hosted zone.
    Type: CommaDelimitedList

Conditions:
  HasNoComment: !Equals [ !Ref Comment, "" ]
  HasComment: !Not [Condition: HasNoComment]
  IsPublicHostedZone: !Equals [ !Select [0, !Ref VpcIds], ""]
  SaveInS3File: !Equals [ !Ref SaveInS3File, "true"]

Resources:
  HostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      HostedZoneConfig: !If
        - HasComment
        - Comment: !Ref Comment
        - !Ref AWS::NoValue
      HostedZoneTags:
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: "CloudFormation"
        - Key: ProjectName
          Value: !Ref ProjectName
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-${Name}"
        - Key: StackName
          Value: !Ref AWS::StackName
      Name: !Ref Name
      VPCs: !If
        - IsPublicHostedZone
        - !Ref AWS::NoValue
        - - VPCId: !Select [0, !Ref VpcIds]
            VPCRegion: !Select [0, !Ref VpcRegions]
          - VPCId: !Select [1, !Ref VpcIds]
            VPCRegion: !Select [1, !Ref VpcRegions]

  HostedZoneToS3:
    Type: AWS::CloudFormation::CustomResource
    Condition: SaveInS3File
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ServiceToken: !Join [ ":", [ "arn:aws:lambda", !Sub "${AWS::Region}", !Sub "${AWS::AccountId}", "function:Route53ResourceToS3"]]
      ServiceTimeout: 60
      Bucket: !Ref Bucket
      BucketKey: !Ref BucketKey
      BucketObject: !Ref BucketObject
      Region: !Ref AWS::Region
      ResourceType: "HostedZone"
      Key: !Sub "${AWS::Region}:${ProjectName}:${EnvironmentName}:Route53:HostedZone:${Name}"
      Value: !Ref HostedZone

Outputs:
  HostedZoneId:
    Description: "ID of the hosted zone"
    Value: !Ref HostedZone
    Export:
      Name: !Sub "${AWS::StackName}-HostedZoneId"
  
  HostedZoneName:
    Description: "Name of the hosted zone"
    Value: !Ref Name
    Export:
      Name: !Sub "${AWS::StackName}-HostedZoneName"