---
AWSTemplateFormatVersion: "2010-09-09"
Description: "Template to deploy Route53 RecordSet for VPC Endpoints"

Parameters:
  # Global parameters
  Bucket:
    Default: "hawkfund-cloudformation"
    Description: CloudFormation bucket URL
    Type: String
  BucketKey:
    Default: ""
    Description: Key to find object in the bucket
    Type: String
  BucketObject:
    Default: "Data.json"
    Description: "File to store data in the bucket"
    Type: String
  EnvironmentName:
    AllowedValues: ["dev", "test", "staging", "prod"]
    ConstraintDescription: "Must specify dev, test, staging, or prod"
    Default: "dev"
    Description: "Environment name that prefix all resources"
    Type: String    
  ProjectName:
    Default: "ANS"
    Description: "Project name that prefix all resources"
    Type: String
  SaveInS3File:
    AllowedValues: [ "false", "true" ]
    Default: "false"
    Description: "Save resources information in s3 file"
    Type: String

  # VPC Endpoint specific parameters
  VPCEndpointType:
    AllowedValues: ["Interface", "Gateway"]
    Default: "Interface"
    Description: "Type of VPC Endpoint"
    Type: String
  ServiceName:
    Description: >-
      Required: The AWS service name (e.g., s3, ec2, rds, etc.) or full service name.
    Type: String
  
  # DNS parameters
  Comment:
    Default: ""
    Description: >-
      Optional: Any comments you want to include about the DNS record.
    MaxLength: 256  
    Type: String
  HostedZoneId:
    Default: ""
    Description: >-
      The ID of the private hosted zone. Leave empty to use HostedZoneName.
    Type: String
  HostedZoneName:
    Default: ""
    Description: >-
      The name of the private hosted zone (e.g., company.internal).
    MaxLength: 253
    Type: String
  RecordName:
    Description: >-
      Required: The DNS record name (e.g., s3.company.internal).
    Type: String
  ResourceRecords:
    Description: >-
      One or more values that correspond with the value that you specified for
      the Type property. For example, if you specified A for Type, you specify
      one or more IP addresses in IPv4 format for ResourceRecords. For
      information about the format of values for each record type, see Supported
      DNS Resource Record Types in the Amazon Route 53 Developer Guide.
    Type: String
  TTL:
    Default: 60
    Description: >-
      Optional: The DNS record cache time to live (TTL), in seconds. Lower for VPC endpoints.
    Type: String
  Type:
    AllowedValues: ["A","AAAA","CAA","CNAME","DS","MX","NAPTR","NS","PTR","SOA","SPF","SRV","TXT","TLSA","SSHFP","SVCB","HTTPS"]
    Default: "A"
    Description: >-
      The DNS record type. For information about different record types and how
      data is encoded for them, see Supported DNS Resource Record Types in the
      Amazon Route 53 Developer Guide
    Type: String

  CreateWildcardRecord:
    AllowedValues: ["false", "true"]
    Default: "false"
    Description: "Create wildcard record for services that support it (e.g., *.s3.region.amazonaws.com)"
    Type: String

Conditions:
  HasNoHostedZoneId: !Equals [ !Ref HostedZoneId, "" ]
  HasHostedZoneId: !Not [ !Equals [ !Ref HostedZoneId, "" ] ]
  HasNoHostedZoneName: !Equals [ !Ref HostedZoneName, "" ]
  IsInterfaceEndpoint: !Equals [ !Ref VPCEndpointType, "Interface" ]
  IsGatewayEndpoint: !Equals [ !Ref VPCEndpointType, "Gateway" ]
  SaveInS3File: !Equals [ !Ref SaveInS3File, "true"]
  CreateWildcard: !Equals [ !Ref CreateWildcardRecord, "true"]
  ValidHostedZoneConfig: !Or 
    - !And [ !Condition HasHostedZoneId, !Condition HasNoHostedZoneName ]
    - !And [ !Condition HasNoHostedZoneId, !Not [ !Condition HasNoHostedZoneName ] ]

Resources:

  # Main DNS record for VPC Endpoint
  VPCEndpointRecordSet:
    Type: AWS::Route53::RecordSet
    Condition: IsInterfaceEndpoint
    Properties:
      Comment: !Sub "${Comment} - VPC Endpoint ${VPCEndpointId} for ${ServiceName}"
      HostedZoneId: !If 
        - HasHostedZoneId
        - !Ref HostedZoneId
        - !Ref AWS::NoValue
      HostedZoneName: !If 
        - HasNoHostedZoneId
        - !Ref HostedZoneName
        - !Ref AWS::NoValue
      Name: !Ref RecordName
      ResourceRecords: !Ref ResourceRecords
      TTL: !Ref TTL
      Type: !Ref Type

  # Wildcard DNS record for services that support it (e.g., S3)
  WildcardRecordSet:
    Type: AWS::Route53::RecordSet
    Condition: CreateWildcard
    Properties:
      Comment: !Sub "${Comment} - Wildcard record for VPC Endpoint ${VPCEndpointId}"
      HostedZoneId: !If 
        - HasHostedZoneId
        - !Ref HostedZoneId
        - !Ref AWS::NoValue
      HostedZoneName: !If 
        - HasNoHostedZoneId
        - !Ref HostedZoneName
        - !Ref AWS::NoValue
      Name: !Sub "*.${RecordName}"
      ResourceRecords: !Ref ResourceRecords
      TTL: !Ref TTL
      Type: A

  # Gateway endpoint record (for S3 and DynamoDB)
  GatewayEndpointRecordSet:
    Type: AWS::Route53::RecordSet
    Condition: IsGatewayEndpoint
    Properties:
      Comment: !Sub "${Comment} - Gateway VPC Endpoint for ${ServiceName}"
      HostedZoneId: !If 
        - HasHostedZoneId
        - !Ref HostedZoneId
        - !Ref AWS::NoValue
      HostedZoneName: !If 
        - HasNoHostedZoneId
        - !Ref HostedZoneName
        - !Ref AWS::NoValue
      Name: !Ref RecordName
      ResourceRecords: 
        - !Sub "${ServiceName}.${AWS::Region}.amazonaws.com"
      TTL: !Ref TTL
      Type: CNAME

  # Save VPC Endpoint record info to S3
  VPCEndpointRecordToS3:
    Type: AWS::CloudFormation::CustomResource
    Condition: SaveInS3File
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ServiceToken: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:Route53ResourceToS3"
      ServiceTimeout: 60
      Bucket: !Ref Bucket
      BucketKey: !Ref BucketKey
      BucketObject: !Ref BucketObject
      Region: !Ref AWS::Region
      ResourceType: "VPCEndpointRecordSet"
      Key: !Sub "${AWS::Region}:${ProjectName}:${EnvironmentName}:Route53:VPCEndpoint:${ServiceName}:${RecordName}"
      Value: !If 
        - IsInterfaceEndpoint
        - !Ref VPCEndpointRecordSet
        - !Ref GatewayEndpointRecordSet
      VPCEndpointId: !Ref VPCEndpointId
      ServiceName: !Ref ServiceName
      EndpointType: !Ref VPCEndpointType

Rules:
  ValidateHostedZoneParameters:
    Assertions:
      - Assert: !Condition ValidHostedZoneConfig
        AssertDescription: "You must provide either HostedZoneId OR HostedZoneName, but not both."

Outputs:
  VPCEndpointRecordSetId:
    Description: "ID of the VPC Endpoint DNS record"
    Value: !If 
      - IsInterfaceEndpoint
      - !Ref VPCEndpointRecordSet
      - !Ref GatewayEndpointRecordSet
    Export:
      Name: !Sub "${AWS::StackName}-VPCEndpointRecordSetId"
  
  WildcardRecordSetId:
    Condition: CreateWildcard
    Description: "ID of the wildcard DNS record"
    Value: !Ref WildcardRecordSet
    Export:
      Name: !Sub "${AWS::StackName}-WildcardRecordSetId"
  
  RecordName:
    Description: "DNS record name created"
    Value: !Ref RecordName
    Export:
      Name: !Sub "${AWS::StackName}-RecordName"

  VPCEndpointId:
    Description: "VPC Endpoint ID used"
    Value: !Ref VPCEndpointId
    Export:
      Name: !Sub "${AWS::StackName}-VPCEndpointId"

  ServiceName:
    Description: "Service name for the VPC Endpoint"
    Value: !Ref ServiceName
    Export:
      Name: !Sub "${AWS::StackName}-ServiceName"