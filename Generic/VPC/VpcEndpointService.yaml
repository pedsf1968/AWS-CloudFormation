---
AWSTemplateFormatVersion: "2010-09-09"
Description:  This template VPC Endpoint Service for NLB or GLB

Parameters:
  # Global parameters
  Bucket:
    Default: "hawkfund-cloudformation"
    Description: CloudFormation buket URL
    Type: String
  BucketKey:
    Default: ""
    Description: Key to find object in the bucket
    Type: String
  BucketObject:
    Default: "Data.json"
    Description: "File to store data in the bucket"
    Type: String
  EnvironmentName:
    AllowedValues: ["dev", "test", "staging", "prod"]
    ConstraintDescription: "Must specify dev, test or prod"
    Default: "dev"
    Description: "Environment name that prefix all resources"
    Type: String    
  ProjectName:
    Default: "ANS"
    Description: "Project name that prefix all resources"
    Type: String
  SaveInS3File:
    AllowedValues: [ "false", "true" ]
    Default: "false"
    Description: "Save resources information in s3 file"
    Type: String

  # Stack parameters
  AcceptanceRequired:
    AllowedValues: [ "true", "false" ]
    Default: "true"
    Description: "Indicates whether requests from service consumers to create an endpoint to your service must be accepted."
    Type: String
  ContributorInsightsEnabled:
    AllowedValues: [ "true", "false" ]
    Default: "false"
    Description: >-
      Indicates whether to enable the built-in Contributor Insights rules
      provided by AWS PrivateLink.
    Type: String 
  GatewayLoadBalancerArn:
    Default: ""
    Description: "The Amazon Resource Names (ARNs) of the Gateway Load Balancers."
    Type: String
  NetworkLoadBalancerArn:
    Default: ""
    Description: "The Amazon Resource Names (ARNs) of the Network Load Balancers."
    Type: String
  PayerResponsibility:
    AllowedValues: ["", ServiceOwner]
    Default: ""
    Description: >-
      The entity that is responsible for the endpoint costs. The default is the
      endpoint owner. If you set the payer responsibility to the service owner,
      you cannot set it back to the endpoint owner.
    Type: String
  VpcEndpointServiceType:
    AllowedValues: [ "network", "gateway" ]
    Default: "network"
    Type: String

Conditions:
  isNetworkType: !Equals [ !Ref VpcEndpointServiceType, "network" ]
  isGatewayType: !Equals [ !Ref VpcEndpointServiceType, "gateway" ]
  hasNoPayerResponsibility: !Equals [ !Ref PayerResponsibility, ""]
  SaveInS3File: !Equals [ !Ref SaveInS3File, "true"]

Resources:
  NLBEndpointService:
    Type: AWS::EC2::VPCEndpointService
    Condition: isNetworkType
    Properties:
      AcceptanceRequired: !Ref AcceptanceRequired
      # ContributorInsightsEnabled: !Ref ContributorInsightsEnabled
      NetworkLoadBalancerArns: 
        - !Ref NetworkLoadBalancerArn
      # PayerResponsibility: !If
      #   - hasNoPayerResponsibility
      #   - "AWS::NoValue"
      #   - !Ref PayerResponsibility
      Tags:
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-NLB-VPCE-SVC"
        - Key: ManagedBy
          Value: "CloudFormation"
        - Key: ProjectName
          Value: !Ref ProjectName

  GLBEndpointService:
    Type: AWS::EC2::VPCEndpointService
    Condition: isGatewayType
    Properties:
      AcceptanceRequired: !Ref AcceptanceRequired
      NetworkLoadBalancerArns: 
        - !Ref GatewayLoadBalancerArn
      Tags:
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-GLB-VPCE-SVC"
        - Key: ManagedBy
          Value: "CloudFormation"
        - Key: ProjectName
          Value: !Ref ProjectName

  VpcEndpointServiceToS3:
    Type: AWS::CloudFormation::CustomResource
    Condition: SaveInS3File
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ServiceToken: !Join [ ":", [ "arn:aws:lambda", !Sub "${AWS::Region}", !Sub "${AWS::AccountId}", "function:Ec2ResourceToS3"]]
      ServiceTimeout: 60
      Bucket: !Ref Bucket
      BucketKey: !Ref BucketKey
      BucketObject: !Ref BucketObject
      Region: !Ref AWS::Region
      ResourceType: "VpcEndpointService"
      Key: !Sub "${AWS::Region}:${ProjectName}:${EnvironmentName}:EC2:VPCEndpointService:${VpcEndpointServiceType}"
      Value: !If
        - isNetworkType
        - !Ref NLBEndpointService
        - !Ref GLBEndpointService

Outputs:
  VPCEndpointServiceId:
    Description: "Returns the ID of the VPC endpoint service configuration."
    Value: !If
      - isNetworkType
      - !Ref NLBEndpointService
      - !Ref GLBEndpointService

  VPCEndpointServiceName:
    Description: "Returns the name of the VPC endpoint service."
    Value: !If
      - isNetworkType
      - !Join [".", ["com.amazonaws.vpce", !Ref "AWS::Region" , !Ref NLBEndpointService]]
      - !Join [".", ["com.amazonaws.vpce", !Ref "AWS::Region" , !Ref GLBEndpointService]]

