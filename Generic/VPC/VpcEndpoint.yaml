---
AWSTemplateFormatVersion: "2010-09-09"
Description: This template creates VPC Endpoint Service for NLB or GLB

Parameters:
  # Global parameters
  Bucket:
    Default: "hawkfund-cloudformation"
    Description: CloudFormation bucket URL
    Type: String
  BucketKey:
    Default: ""
    Description: Key to find object in the bucket
    Type: String
  BucketObject:
    Default: "Data.json"
    Description: "File to store data in the bucket"
    Type: String
  EnvironmentName:
    AllowedValues: ["dev", "test", "staging", "prod"]
    ConstraintDescription: "Must specify dev, test, staging, or prod"
    Default: "dev"
    Description: "Environment name that prefixes all resources"
    Type: String    
  ProjectName:
    Default: "ANS"
    Description: "Project name that prefixes all resources"
    Type: String
  SaveInS3File:
    AllowedValues: [ "false", "true" ]
    Default: "false"
    Description: "Save resources information in s3 file"
    Type: String

  # Stack parameters
  DnsRecordIpType:
    AllowedValues: ["ipv4", "ipv6", "dualstack", "service-defined", "not-specified"]
    Default: "ipv4"
    Description: "The DNS records created for the endpoint."
    Type: String
  IpAddressType:
    AllowedValues: ["ipv4","ipv6","dualstack","not-specified"]
    Default: "not-specified"
    Description: The supported IP address types.
    Type: String
  PolicyDocument:
    Default: ""
    Description: |
      An endpoint policy, which controls access to the service from the VPC. 
      The default endpoint policy allows full access to the service. 
      Endpoint policies are supported only for gateway and interface endpoints.
    Type: String
  PrivateDnsEnabled:
    AllowedValues: [ "true", "false" ]
    Default: "false"
    Description: |
      Indicate whether to associate a private hosted zone with the specified VPC. 
      The private hosted zone contains a record set for the default public DNS name 
      for the service for the Region, which resolves to the private IP addresses 
      of the endpoint network interfaces in the VPC.
    Type: String
  PrivateDnsOnlyForInboundResolverEndpoint:
    AllowedValues: [OnlyInboundResolver, AllResolvers, NotSpecified]
    Default: NotSpecified
    Description: >-
      Indicates whether to enable private DNS only for inbound endpoints. This
      option is available only for services that support both gateway and
      interface endpoints. It routes traffic that originates from the VPC to
      the gateway endpoint and traffic that originates from on-premises to the
      interface endpoint.
    Type: String
  ResourceConfigurationArn:
    Default: ""
    Description: The Amazon Resource Name (ARN) of the resource configuration.
    Type: String
  RouteTableIds:
    Default: ""
    Description: The ID of the route tables. Routing is supported only for gateway endpoints.
    Type: CommaDelimitedList
  ServiceName:
    Description: "The name of the endpoint service."
    Type: String
  SecurityGroupIds:
    Default: ""
    Description: "The Security Group for VPC Endpoint."
    Type: CommaDelimitedList
  SubnetIds:
    Default: ""
    Description: |
      The IDs of the subnets in which to create endpoint network interfaces.
      You must specify this property for an interface endpoint or a Gateway
      Load Balancer endpoint. You can't specify this property for a gateway
      endpoint. For a Gateway Load Balancer endpoint, you can specify only
      one subnet.
    Type: CommaDelimitedList
  VpcId:
    Type: String
    Description: "The VPC ID where the endpoint will be created"
  VpcEndpointType:
    Description: "The type of endpoint."
    Type: String
    Default: "Gateway"
    AllowedValues:
      - "Gateway"
      - "GatewayLoadBalancer"
      - "Interface"

Conditions:
  isGatewayType: !Equals [ !Ref VpcEndpointType, "Gateway"]
  isGatewayLoadBalancerType: !Equals [ !Ref VpcEndpointType, "GatewayLoadBalancer"]
  isInterfaceType: !Equals [ !Ref VpcEndpointType, "Interface"]
  SaveInS3File: !Equals [ !Ref SaveInS3File, "true"]
  hasPolicyDocument: !Not [!Equals [!Ref PolicyDocument, ""]]
  hasRouteTableIds: !Not [!Equals [!Join ["", !Ref RouteTableIds], ""]]
  hasSecurityGroupIds: !Not [!Equals [!Join ["", !Ref SecurityGroupIds], ""]]
  hasSubnetIds: !Not [!Equals [!Join ["", !Ref SubnetIds], ""]]
  hasResourceConfigurationArn: !Not [!Equals [!Ref ResourceConfigurationArn, ""]]
  hasNetworkInterfaces: !Or [!Condition isInterfaceType, !Condition isGatewayLoadBalancerType]

Resources:
  VpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      DnsOptions:
        DnsRecordIpType: !Ref DnsRecordIpType
        PrivateDnsOnlyForInboundResolverEndpoint: !Ref PrivateDnsOnlyForInboundResolverEndpoint
      PolicyDocument: !If [hasPolicyDocument, !Ref PolicyDocument, !Ref "AWS::NoValue"]
      PrivateDnsEnabled: !If 
        - isInterfaceType
        - !Ref PrivateDnsEnabled
        - "false"
      ResourceConfigurationArn: !If 
        - hasResourceConfigurationArn
        - !Ref ResourceConfigurationArn
        - !Ref "AWS::NoValue"
      RouteTableIds: !If
        - isGatewayType
        - !If [hasRouteTableIds, !Ref RouteTableIds, !Ref "AWS::NoValue"]
        - !Ref "AWS::NoValue"
      SecurityGroupIds: !If
        - isInterfaceType
        - !If [hasSecurityGroupIds, !Ref SecurityGroupIds, !Ref "AWS::NoValue"]
        - !Ref "AWS::NoValue"
      ServiceName: !Ref ServiceName
      SubnetIds: !If
        - isGatewayType
        - !Ref "AWS::NoValue"
        - !If [hasSubnetIds, !Ref SubnetIds, !Ref "AWS::NoValue"]
      Tags:
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-VPCE-${VpcEndpointType}"
        - Key: ManagedBy
          Value: "CloudFormation"
        - Key: ProjectName
          Value: !Ref ProjectName
        - Key: VpcEndpointType
          Value: !Ref VpcEndpointType
      VpcEndpointType: !Ref VpcEndpointType
      VpcId: !Ref VpcId

  VpcEndpointToS3:
    Type: AWS::CloudFormation::CustomResource
    Condition: SaveInS3File
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ServiceToken: !Join [ ":", [ "arn:aws:lambda", !Sub "${AWS::Region}", !Sub "${AWS::AccountId}", "function:Ec2ResourceToS3"]]
      ServiceTimeout: 60
      Bucket: !Ref Bucket
      BucketKey: !Ref BucketKey
      BucketObject: !Ref BucketObject
      Region: !Ref AWS::Region
      ResourceType: "VpcEndpoint"
      Key: !Sub "${AWS::Region}:${ProjectName}:${EnvironmentName}:EC2:VPCEndpoint:${VpcEndpointType}"
      Value: !Ref VpcEndpoint

Outputs:
  VpcEndpointId:
    Description: "Returns the ID of the VPC endpoint."
    Value: !Ref VpcEndpoint
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-VpcEndpoint-Id"
  
  VpcEndpointType:
    Description: "Returns the type of the VPC endpoint."
    Value: !Ref VpcEndpointType
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-VpcEndpoint-Type"
  
  VpcEndpointDnsEntries:
    Description: "Returns the DNS entries for the VPC endpoint."
    Value: !Join [",", !GetAtt VpcEndpoint.DnsEntries]
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-VpcEndpoint-DnsEntries"
    Condition: hasNetworkInterfaces
  
  VpcEndpointNetworkInterfaceIds:
    Description: "Returns the network interface IDs of the VPC endpoint."
    Value: !Join [",", !GetAtt VpcEndpoint.NetworkInterfaceIds]
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-VpcEndpoint-NetworkInterfaceIds"
    Condition: hasNetworkInterfaces