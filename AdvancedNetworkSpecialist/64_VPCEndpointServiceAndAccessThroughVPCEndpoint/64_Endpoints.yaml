---
AWSTemplateFormatVersion: "2010-09-09"
Description:  This template create a SQS Interface Endpoint

Parameters:
  # Global parameters
  Bucket:
    Default: "hawkfund-cloudformation"
    Description: CloudFormation buket URL
    Type: String
  BucketKey:
    Default: "64_VPCEndpointServiceAndAccessThroughVPCEndpoint"
    Description: Key to find object in the bucket
    Type: String
  BucketObject:
    Default: "Data.json"
    Description: "File to store data in the bucket"
    Type: String
  EnvironmentName:
    AllowedValues: ["dev", "test", "staging", "prod"]
    ConstraintDescription: "Must specify dev, test or prod"
    Default: "dev"
    Description: "Environment name that prefix all resources"
    Type: String    
  ProjectName:
    Default: "ANS"
    Description: "Project name that prefix all resources"
    Type: String
  SaveInS3File:
    AllowedValues: [ "false", "true" ]
    Default: "false"
    Description: "Save resources information in s3 file"
    Type: String

  # Stack parameters
  AcceptanceRequired:
    AllowedValues: [ "true", "false" ]
    Default: "false"
    Description: "Indicates whether requests from service consumers to create an endpoint to your service must be accepted."
    Type: String
  NetworkLoadBalancerArn:
    Description: "The Amazon Resource Names (ARNs) of the Network Load Balancers."
    Type: String
    Default: ""
  VpcEpSecurityGroupIds:
    Description: "The Security Group for VPC Endpoint."
    Type: String
  VpcEpSubnetIds:
    Type: String
  VpcEpVpcId:
    Type: String

Resources:
  ServicesVPCEndpointService:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.eu-west-3.amazonaws.com/Generic/VPC/VpcEndpointService.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        AcceptanceRequired: !Ref AcceptanceRequired
        NetworkLoadBalancerArn: !Ref NetworkLoadBalancerArn
        VpcESType: network

  ConsumerVPCEndpoint:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.eu-west-3.amazonaws.com/Generic/VPC/VpcEndpoint.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        SecurityGroupIds: !Ref VpcEpSecurityGroupIds
        ServiceName: !GetAtt ServicesVPCEndpointService.Outputs.VPCEndpointServiceName
        SubnetIds: !Ref VpcEpSubnetIds
        VpcId: !Ref VpcEpVpcId
        VpcEndpointType: "Interface"

Outputs:
  ServicesVPCEndpointServiceId:
    Description: "Returns the ID of the VPC endpoint service configuration."
    Value: !GetAtt ServicesVPCEndpointService.Outputs.VPCEndpointServiceId

  VPCEndpointServiceName:
    Value: !GetAtt ServicesVPCEndpointService.Outputs.VPCEndpointServiceName
