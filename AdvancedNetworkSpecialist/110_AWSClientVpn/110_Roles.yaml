---
AWSTemplateFormatVersion: "2010-09-09"
Description:  This template deploy Roles

Parameters:
  # Global parameters
  Bucket:
    Description: "CloudFormation bucket URL"
    Type: String
    Default: "hawkfund-cloudformation"
  BucketKey:
    Description: "Key to find object in the bucket"
    Type: String
    Default: "110_AWSClientVpn"
  BucketObject:
    Description: "File to store data in the bucket"
    Type: String
    Default: "Data.json"
  BucketRegion:
    AllowedValues: ["eu-west-3", "eu-central-1"]
    Default: "eu-west-3"
    Description: "Region where is the Bucket"
    Type: String
  EnvironmentName:
    Description: "Environment name that prefix all resources"
    Type: String
    Default: "dev"
    AllowedValues:
      - "dev"
      - "test"
      - "prod"
    ConstraintDescription: Must specify dev, test or prod
  ProjectName:
    Description: "Project name that prefix all resources"
    Type: String
    Default: "ANS"
  SaveInS3File:
    AllowedValues: [ "false", "true" ]
    Default: "false"
    Description: "Save resources information in s3 file"
    Type: String

Resources:
  InstanceRoleStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/IAM/InstanceRole.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        InstanceProfileName: Private-Instance-Profile
        RoleName: Private-Instance-Role
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File

  InstanceCAServerRoleStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.eu-west-3.amazonaws.com/Generic/IAM/InstanceCAServerRole.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        InstanceProfileName: CA-Instance-Profile
        RoleName: CA-Instance-Role
        SaveInS3File: !Ref SaveInS3File

Outputs:
  InstanceRoleArn:
    Description: "Instance Role ARN"
    Value: !GetAtt InstanceRoleStack.Outputs.RoleArn
  InstanceRoleId:
    Description: "Instance Role ID"
    Value: !GetAtt InstanceRoleStack.Outputs.RoleId
  InstanceProfileArn:
    Description: "Instance Profile ARN"
    Value: !GetAtt InstanceRoleStack.Outputs.InstanceProfileArn
  InstanceProfileId:
    Description: "Instance Profile ID"
    Value: !GetAtt InstanceRoleStack.Outputs.InstanceProfileId

  InstanceCAServerRoleArn:
    Description: "Instance CA Server Role ARN"
    Value: !GetAtt InstanceCAServerRoleStack.Outputs.RoleArn
  InstanceCAServerRoleId:
    Description: "Instance CA Server Role ID"
    Value: !GetAtt InstanceCAServerRoleStack.Outputs.RoleId
  InstanceCAServerProfileArn:
    Description: "Instance CA Server Profile ARN"
    Value: !GetAtt InstanceCAServerRoleStack.Outputs.InstanceProfileArn
  InstanceCAServerProfileId:
    Description: "Instance CA Server Profile ID"
    Value: !GetAtt InstanceCAServerRoleStack.Outputs.InstanceProfileId