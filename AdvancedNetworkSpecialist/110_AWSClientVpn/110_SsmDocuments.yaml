---
AWSTemplateFormatVersion: "2010-09-09"
Description:  This template create SSM Document to deploy Apache Httpd

Parameters:
  # Global parameters
  Bucket:
    Default: "hawkfund-cloudformation"
    Description: CloudFormation buket URL
    Type: String
  BucketKey:
    Default: "110_AWSClientVpn"
    Description: Key to find object in the bucket
    Type: String
  BucketObject:
    Default: "Data.json"
    Description: "File to store data in the bucket"
    Type: String
  BucketRegion:
    AllowedValues: ["eu-west-3", "eu-central-1"]
    Default: "eu-west-3"
    Description: "Region where is the Bucket"
    Type: String
  EnvironmentName:
    AllowedValues: ["dev", "staging", "test", "prod"]
    ConstraintDescription: "Must specify dev, staging, test or prod"
    Default: "dev"
    Description: "Environment name that prefix all resources"
    Type: String
  ProjectName:
    Default: "ANS"
    Description: "Project name that prefix all resources"
    Type: String
  SaveInS3File:
    AllowedValues: ["false", "true"]
    Default: "false"
    Description: "Save resources information in s3 file"
    Type: String

Resources:
  EasyRsaInstallerSsmDocument:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/SSM/EasyRsaInstallerSsmDocument.yaml"
      TimeoutInMinutes: 10
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        BucketRegion: !Ref BucketRegion
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName

  EasyRsaCACertificateSsmDocument:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/SSM/EasyRsaCACertificateSsmDocument.yaml"
      TimeoutInMinutes: 10
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        BucketRegion: !Ref BucketRegion
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName

  EasyRsaServerCertificateSsmDocument:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/SSM/EasyRsaServerCertificateSsmDocument.yaml"
      TimeoutInMinutes: 10
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        BucketRegion: !Ref BucketRegion
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName

  EasyRsaClientCertificateSsmDocument:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/SSM/EasyRsaClientCertificateSsmDocument.yaml"
      TimeoutInMinutes: 10
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        BucketRegion: !Ref BucketRegion
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName

Outputs:
  EasyRsaInstallerSsmDocumentName:
    Description: "Name of the created SSM Document"
    Value: !GetAtt EasyRsaInstallerSsmDocument.Outputs.SsmDocumentName
  EasyRsaInstallerSsmDocumentArn:
    Description: "ARN of the created SSM Document"
    Value: !GetAtt EasyRsaInstallerSsmDocument.Outputs.SsmDocumentArn

  EasyRsaCACertificateSsmDocumentName:
    Description: "Name of the created SSM Document"
    Value: !GetAtt EasyRsaCACertificateSsmDocument.Outputs.SsmDocumentName
  EasyRsaCACertificateSsmDocumentArn:
    Description: "ARN of the created SSM Document"
    Value: !GetAtt EasyRsaCACertificateSsmDocument.Outputs.SsmDocumentArn 

  EasyRsaServerCertificateSsmDocumentName:
    Description: "Name of the created SSM Document"
    Value: !GetAtt EasyRsaServerCertificateSsmDocument.Outputs.SsmDocumentName
  EasyRsaServerCertificateSsmDocumentArn:
    Description: "ARN of the created SSM Document"
    Value: !GetAtt EasyRsaServerCertificateSsmDocument.Outputs.SsmDocumentArn

  EasyRsaClientCertificateSsmDocumentName:
    Description: "Name of the created SSM Document"
    Value: !GetAtt EasyRsaClientCertificateSsmDocument.Outputs.SsmDocumentName
  EasyRsaClientCertificateSsmDocumentArn:
    Description: "ARN of the created SSM Document"
    Value: !GetAtt EasyRsaClientCertificateSsmDocument.Outputs.SsmDocumentArn