---
AWSTemplateFormatVersion: "2010-09-09"
Description: This template generate AMI from Instance and create application Instance from the AMI

Parameters:
  # Global parameters
  Bucket:
    Default: "hawkfund-cloudformation"
    Description: CloudFormation buket URL
    Type: String
  BucketKey:
    Default: "110_AWSClientVpn"
    Description: Key to find object in the bucket
    Type: String
  BucketObject:
    Default: "Data.json"
    Description: "File to store data in the bucket"
    Type: String
  BucketRegion:
    AllowedValues: ["eu-west-3", "eu-central-1"]
    Default: "eu-west-3"
    Description: "Region where is the Bucket"
    Type: String
  EnvironmentName:
    AllowedValues: ["dev", "staging", "test", "prod"]
    ConstraintDescription: "Must specify dev, staging, test or prod"
    Default: "dev"
    Description: "Environment name that prefix all resources"
    Type: String
  ProjectName:
    Default: "ANS"
    Description: "Project name that prefix all resources"
    Type: String
  SaveInS3File:
    AllowedValues: ["false", "true"]
    Default: "false"
    Description: "Save resources information in s3 file"
    Type: String

  # Stack parameters
  RootCaName:
    Default: "OpenVPN-CA"
    Description: "The name of the CA certificate"
    Type: String
  ClientName:
    Default: "client1.domain.kr"
    Description: "The base name of the client certificate"
    Type: String
  KeyName:
    Default: "dso-paris"
    Description: "Instances Key name"
    Type: String
  ServerName:
    Default: "application.domain.kr"
    Description: "The base name of the server certificate"
    Type: String

  # Bastion parameters
  BastionInstanceImageId:
    Default: ami-096dd88190a75cd20
    Description: "Bastion Instance AMI"
    Type: AWS::EC2::Image::Id
  BastionInstanceName:
    Default: "bastion"
    Description: "Bastion Instances name"
    Type: String
  BastionInstanceProfile:
    Description: "Profile of the Application"
    Type: String
  BastionInstanceType:
    Default: t3a.micro
    Description: "Bastion Instances type"
    Type: String
  BastionInstanceSecurityGroup:
    Description: "Bastion Security Group"
    Type: String
  BastionInstanceSubnetId:
    Description: "Bastion Subnet ID"
    Type: String

  # Application parameters
  ApplicationInstanceImageId:
    Default: "096dd88190a75cd20"
    Description: "Web Server AMI"
    Type: AWS::EC2::Image::Id
  ApplicationInstanceName:
    Default: "application"
    Description: "Application Instances name"
    Type: String
  ApplicationInstanceProfile:
    Description: "Profile of the Application"
    Type: String
  ApplicationInstanceType:
    Default: t3a.micro
    Description: "Application Instances type"
    Type: String
  ApplicationInstanceSecurityGroup:
    Description: "Application Security Group"
    Type: String
  ApplicationInstanceSubnetId:
    Description: "Application Subnet ID"
    Type: String

  CaServerInstanceImageId:
    Default: ami-096dd88190a75cd20
    Description: "CA Instance AMI"
    Type: AWS::EC2::Image::Id
  CaServerInstanceName:
    Default: "ca-server"
    Description: "CA Instance name"
    Type: String
  CaServerInstanceProfile:
    Description: "Profile of the CA"
    Type: String
  CaServerInstanceType:
    Default: t3a.nano
    Description: "CA Instance type"
    Type: String
  CaServerInstanceSecurityGroup:
    Description: "CA Security Group"
    Type: String
  CaServerInstanceSubnetId:
    Description: "CA Subnet ID"
    Type: String

Resources:
  BastionInstance:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/EC2/Instance.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        AvailabilityZone: !Select [0, !GetAZs ]
        IamInstanceProfile: !Ref BastionInstanceProfile
        ElasticIP: "true"
        ImageId: !Ref BastionInstanceImageId
        InstanceName: !Ref BastionInstanceName
        InstanceType: !Ref BastionInstanceType
        KeyName: !Ref KeyName
        SecurityGroupIds: !Ref BastionInstanceSecurityGroup
        SubnetId: !Ref BastionInstanceSubnetId

  # Application Instance
  ApplicationInstance:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/EC2/Instance.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        AvailabilityZone: !Select [0, !GetAZs ]
        IamInstanceProfile: !Ref ApplicationInstanceProfile
        ImageId: !Ref ApplicationInstanceImageId
        InstanceName: !Ref ApplicationInstanceName
        InstanceType: !Ref ApplicationInstanceType
        KeyName: !Ref KeyName
        SecurityGroupIds: !Ref ApplicationInstanceSecurityGroup
        SubnetId: !Ref ApplicationInstanceSubnetId

  # Application Instance
  CaInstance:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/EC2/Instance.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        AvailabilityZone: !Select [0, !GetAZs ]
        IamInstanceProfile: !Ref CaServerInstanceProfile
        ImageId: !Ref CaServerInstanceImageId
        InstanceName: !Ref CaServerInstanceName
        InstanceType: !Ref CaServerInstanceType
        KeyName: !Ref KeyName
        SecurityGroupIds: !Ref CaServerInstanceSecurityGroup
        SubnetId: !Ref CaServerInstanceSubnetId

  EasyRsaInstallerSsmAssociation:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/SSM/EasyRsaInstallerSsmAssociation.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        BucketRegion: !Ref BucketRegion
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        InstallDirectory: "/opt/openvpn-setup"
        InstanceId: !GetAtt CaInstance.Outputs.InstanceId
        OutputS3BucketName: !Ref Bucket

  EasyRsaCACertificateSsmAssociation:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    DependsOn:
      - EasyRsaInstallerSsmAssociation
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/SSM/EasyRsaCACertificateSsmAssociation.yaml"
      TimeoutInMinutes: 10
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        BucketRegion: !Ref BucketRegion
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        RootCaName: !Ref RootCaName
        InstallDirectory: "/opt/openvpn-setup"
        InstanceId: !GetAtt CaInstance.Outputs.InstanceId
        OutputS3BucketName: !Ref Bucket

  EasyRsaServerCertificateSsmAssociation:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    DependsOn:
      - EasyRsaInstallerSsmAssociation
      - EasyRsaCACertificateSsmAssociation
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/SSM/EasyRsaServerCertificateSsmAssociation.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        BucketRegion: !Ref BucketRegion
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        InstanceId: !GetAtt CaInstance.Outputs.InstanceId
        ServerName: !Ref ServerName
        OutputS3BucketName: !Ref Bucket

  EasyRsaClientCertificateSsmAssociation:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    DependsOn:
      - EasyRsaInstallerSsmAssociation
      - EasyRsaCACertificateSsmAssociation
      - EasyRsaServerCertificateSsmAssociation
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/SSM/EasyRsaClientCertificateSsmAssociation.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        BucketRegion: !Ref BucketRegion
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        ClientName: !Ref ClientName
        InstanceId: !GetAtt CaInstance.Outputs.InstanceId
        OutputS3BucketName: !Ref Bucket

Outputs:
  BastionInstanceId:
    Description: "Id of the Bastion Instance"
    Value: !GetAtt BastionInstance.Outputs.InstanceId
  BastionPrivateIP:
    Description: "Private IP of the Bastion Instance"
    Value: !GetAtt BastionInstance.Outputs.InstancePrivateIP
  BastionPublicIP:
    Description: "Public IP of the Bastion Instance"
    Value: !GetAtt BastionInstance.Outputs.InstancePublicIP

  ApplicationInstanceId:
    Description: "Application Instances ID"
    Value: !GetAtt ApplicationInstance.Outputs.InstanceId
  ApplicationInstancePrivateIP:
    Description: "Application Instance IP"
    Value: !GetAtt ApplicationInstance.Outputs.InstancePrivateIP
  
  CaInstanceId:
    Description: "CA Instance ID"
    Value: !GetAtt CaInstance.Outputs.InstanceId
  CaInstancePrivateIP:
    Description: "CA Instance IP"
    Value: !GetAtt CaInstance.Outputs.InstancePrivateIP