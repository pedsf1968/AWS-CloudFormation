---
AWSTemplateFormatVersion: "2110-09-09"
Description:  This template create Tables and Route Tables

Parameters:
  # Global parameters
  Bucket:
    Default: "hawkfund-cloudformation"
    Description: CloudFormation buket URL
    Type: String
  BucketKey:
    Default: "21_NatInstance"
    Description: Key to find object in the bucket
    Type: String
  BucketObject:
    Default: "Data.json"
    Description: "File to store data in the bucket"
    Type: String
  BucketRegion:
    AllowedValues: ["eu-west-3", "eu-central-1"]
    Default: "eu-west-3"
    Description: "Region where is the Bucket"
    Type: String
  EnvironmentName:
    AllowedValues: ["dev", "test", "staging", "prod"]
    ConstraintDescription: "Must specify dev, test or prod"
    Default: "dev"
    Description: "Environment name that prefix all resources"
    Type: String    
  ProjectName:
    Default: "ANS"
    Description: "Project name that prefix all resources"
    Type: String
  SaveInS3File:
    AllowedValues: [ "false", "true" ]
    Default: "false"
    Description: "Save resources information in s3 file"
    Type: String
  
  # Stack parameters
  InternetGatewayId:
    Description: "Internet Gateway ID"
    Type: String
  NatInstanceId:
    Description: "NAT Instance ID"
    Type: String
  RouteTableNames:
    Description: "Names of all Route Tables"
    Type: CommaDelimitedList
  PrivateSubnetId:
    Description: "Private Subnets ID"
    Type: String
  PublicSubnetId:
    Description: "Public Subnets ID"
    Type: String
  VpcId:
    Description: "VPC ID"
    Type: String

Resources:  
  # Route, Route Table and Associations
  PublicSubnetRouteTableStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/VPC/RouteTable.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        VpcId: !Ref VpcId
        RouteTableName: !Join [ "-", [ !Select [ 0, !Ref RouteTableNames ], "Bastion" ] ]
        SubnetId: !Ref PublicSubnetId

  PublicSubnetRouteStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/VPC/Route.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        DestinationCidrBlock: "0.0.0.0/0"
        RouteTableId: !GetAtt PublicSubnetRouteTableStack.Outputs.RouteTableId
        RouteTableName: !Join [ "-", [ !Select [ 0, !Ref RouteTableNames ], "Bastion" ] ]
        TargetType: "InternetGateway"
        TargetId: !Ref InternetGatewayId

  PrivateSubnetRouteTableStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/VPC/RouteTable.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        RouteTableName: !Join [ "-", [ !Select [ 0, !Ref RouteTableNames ], "Application" ] ]
        SubnetId: !Ref PrivateSubnetId
        VpcId: !Ref VpcId

  PrivateSubnetRouteStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/VPC/Route.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        DestinationCidrBlock: "0.0.0.0/0"
        RouteTableId: !GetAtt PrivateSubnetRouteTableStack.Outputs.RouteTableId
        RouteTableName: !Join [ "-", [ !Select [ 0, !Ref RouteTableNames ], "Application" ] ]
        TargetType: "Instance"
        TargetId: !Ref NatInstanceId

Outputs:
  PrivateSubnetRouteId:
    Description: "Private Subnet Route ID"
    Value: !GetAtt PrivateSubnetRouteStack.Outputs.RouteId
  PrivateSubnetRouteTableAssociationId:
    Description: "Private Route Table Association ID"
    Value: PrivateSubnetRouteTableStack.Outputs.SubnetRouteTableAssociationId
  PrivateSubnetRouteTableId:
    Description: "Private Subnet Route Table ID"
    Value: !GetAtt PrivateSubnetRouteTableStack.Outputs.RouteTableId

  PublicSubnetRouteId:
    Description: "Public Subnet Route IDs"
    Value: !GetAtt PublicSubnetRouteStack.Outputs.RouteId
  PublicSubnetRouteTableAssociationId:
    Description: "Public Route Table Association ID"
    Value: !GetAtt PublicSubnetRouteTableStack.Outputs.SubnetRouteTableAssociationId
  PublicSubnetRouteTableId:
    Description: "Public Subnet Route Table ID"
    Value: !GetAtt PublicSubnetRouteTableStack.Outputs.RouteTableId
