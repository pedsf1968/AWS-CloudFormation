---
AWSTemplateFormatVersion: "2010-09-09"
Description:  This template deploys a VPC, and Subnets

Parameters:
  # Global parameters
  Bucket:
    Default: "hawkfund-cloudformation"
    Description: CloudFormation buket URL
    Type: String
  BucketKey:
    Default: "112_VpnSplitTunnel"
    Description: Key to find object in the bucket
    Type: String
  BucketObject:
    Default: "Data.json"
    Description: "File to store data in the bucket"
    Type: String
  BucketRegion:
    AllowedValues: ["eu-west-3", "eu-central-1"]
    Default: "eu-west-3"
    Description: "Region where is the Bucket"
    Type: String
  EnvironmentName:
    AllowedValues: ["dev", "staging", "test", "prod"]
    ConstraintDescription: "Must specify dev, staging, test or prod"
    Default: "dev"
    Description: "Environment name that prefix all resources"
    Type: String
  ProjectName:
    Default: "ANS"
    Description: "Project name that prefix all resources"
    Type: String
  SaveInS3File:
    AllowedValues: ["false", "true"]
    Default: "false"
    Description: "Save resources information in s3 file"
    Type: String
  
# Stack parameters
  AvailabilityZone:
    Description: "The AZ of the subnet"
    Type: String

  # Principal network
  PrincipalVpcName:
    Default: "PrincipalVPC"
    Description: "VPC name"
    Type: String
  PrincipalVpcCidrBlock:
    AllowedPattern: "^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\\/(1[6-9]|2[0-8]))$"
    Default: 10.10.0.0/16
    Description: "The IPv4 network range for the VPC, in CIDR notation."
    Type: String
  PrincipalPublicSubnetName:
    Default: "Public"
    Description: "Public Subnet names for Principal VPC"
    Type: String
  PrincipalPublicSubnetCidrBlock:
    AllowedPattern: "^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\\/(1[6-9]|2[0-8]))$"
    Default: "10.10.0.0/24"
    Description: "Public Subnet CIDR for Principal VPC"
    Type: String
  PrincipalSecureSubnetName:
    Default: "PrincipalSecure"
    Description: "Secure Subnet name for Principal VPC"
    Type: String
  PrincipalSecureSubnetCidrBlock:
    AllowedPattern: "^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\\/(1[6-9]|2[0-8]))$"
    Default: "10.10.1.0/24"
    Description: "Secure Subnet CIDR for Principal VPC"
    Type: String
  PrincipalPrivateSubnetNames:
    Default: "Application,VPNTarget"
    Description: "Private Subnet name for Principal VPC"
    Type: CommaDelimitedList
  PrincipalPrivateSubnetCidrBlocks:
    AllowedPattern: "^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\\/(1[6-9]|2[0-8]))$"
    Default: "10.10.2.0/24,10.10.3.0/24"
    Description: "Private Subnet CIDR for Principal VPC"
    Type: CommaDelimitedList

Resources:
  PrincipalVpcStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/VPC/Vpc.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        CidrBlock: !Ref PrincipalVpcCidrBlock
        VpcName: !Ref PrincipalVpcName

  PrincipalPublicSubnetStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/VPC/Subnet.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        AvailabilityZone: !Ref AvailabilityZone
        CidrBlock: !Ref PrincipalPublicSubnetCidrBlock
        MapPublicIpOnLaunch: true
        SubnetName: !Ref PrincipalPublicSubnetName
        VpcId: !GetAtt PrincipalVpcStack.Outputs.VpcId

  PrincipalSecureSubnetStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/VPC/Subnet.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        AvailabilityZone: !Ref AvailabilityZone
        CidrBlock: !Ref PrincipalSecureSubnetCidrBlock
        MapPublicIpOnLaunch: false
        SubnetName: !Ref PrincipalSecureSubnetName
        VpcId: !GetAtt PrincipalVpcStack.Outputs.VpcId

  PrincipalPrivateSubnetAStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/VPC/Subnet.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        AvailabilityZone: !Ref AvailabilityZone
        CidrBlock: !Select [ 0, !Ref PrincipalPrivateSubnetCidrBlocks ]
        MapPublicIpOnLaunch: false
        SubnetName: !Select [ 0, !Ref PrincipalPrivateSubnetNames ]
        VpcId: !GetAtt PrincipalVpcStack.Outputs.VpcId

  PrincipalPrivateSubnetBStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/VPC/Subnet.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        AvailabilityZone: !Ref AvailabilityZone
        CidrBlock: !Select [ 1, !Ref PrincipalPrivateSubnetCidrBlocks ]
        MapPublicIpOnLaunch: false
        SubnetName: !Select [ 1, !Ref PrincipalPrivateSubnetNames ]
        VpcId: !GetAtt PrincipalVpcStack.Outputs.VpcId

Outputs:
  PrincipalVpcId:
    Description: "Id of the Principal VPC"
    Value: !GetAtt PrincipalVpcStack.Outputs.VpcId
  PrincipalVpcCidrBlock:
    Description: "Cidr of the Principal VPC"
    Value: !GetAtt PrincipalVpcStack.Outputs.VpcCidrBlock
  PrincipalPublicSubnetId:
    Description: "Id of the Principal Public Subnet"
    Value: !GetAtt PrincipalPublicSubnetStack.Outputs.SubnetId
  PrincipalPublicSubnetCidr:
    Description: "Cidr of the Principal Public Subnet"
    Value: !GetAtt PrincipalPublicSubnetStack.Outputs.SubnetCidrBlock
  PrincipalSecureSubnetId:
    Description: "Id of the Principal Secure Subnet"
    Value: !GetAtt PrincipalSecureSubnetStack.Outputs.SubnetId
  PrincipalSecureSubnetCidr:
    Description: "Cidr of the Principal Secure Subnets"
    Value: !GetAtt PrincipalSecureSubnetStack.Outputs.SubnetCidrBlock
  PrincipalPrivateSubnetIds:
    Description: "Id of the Principal Private Subnet"
    Value: !Join 
      - ","
      - - !GetAtt PrincipalPrivateSubnetAStack.Outputs.SubnetId
        - !GetAtt PrincipalPrivateSubnetBStack.Outputs.SubnetId
  PrincipalPrivateSubnetCidrs:
    Description: "Cidr of the Principal Private Subnets"
    Value: !Join 
      - ","
      - - !GetAtt PrincipalPrivateSubnetAStack.Outputs.SubnetCidrBlock
        - !GetAtt PrincipalPrivateSubnetBStack.Outputs.SubnetCidrBlock