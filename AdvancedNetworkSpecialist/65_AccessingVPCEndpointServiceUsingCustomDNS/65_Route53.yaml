---
AWSTemplateFormatVersion: "2010-09-09"
Description:  This template create bastion and application Instances and Security Groups

Parameters:
  # Global parameters
  Bucket:
    Default: "hawkfund-cloudformation"
    Description: CloudFormation buket URL
    Type: String
  BucketKey:
    Default: "65_AccessingVPCEndpointServiceUsingCustomDNS"
    Description: Key to find object in the bucket
    Type: String
  BucketObject:
    Default: "Data.json"
    Description: "File to store data in the bucket"
    Type: String
  BucketRegion:
    AllowedValues: ["eu-west-3", "eu-central-1"]
    Default: "eu-west-3"
    Description: "Region where is the Bucket"
    Type: String
  EnvironmentName:
    AllowedValues: ["dev", "test", "staging", "prod"]
    ConstraintDescription: "Must specify dev, test or prod"
    Default: "dev"
    Description: "Environment name that prefix all resources"
    Type: String    
  ProjectName:
    Default: "ANS"
    Description: "Project name that prefix all resources"
    Type: String
  SaveInS3File:
    AllowedValues: [ "false", "true" ]
    Default: "false"
    Description: "Save resources information in s3 file"
    Type: String
  
  # Stack parameters
  HostedZoneName:
    Default: "corp.internal"
    Description: >-
      Optional: The name of the hosted zone.
    MaxLength: 32
    Type: String
  VpcIds:
    Description: "The IDs of the VPC."
    Type: String

Resources:
  HostedZoneStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/Route53/HostedZone.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        Name: !Ref HostedZoneName
        Comment: "My Private Hosted Zone"
        VpcIds: !Ref VpcIds
        VpcRegions: !Join [ ",", [!Ref "AWS::Region", !Ref "AWS::Region"]]

Outputs:
  HostedZoneId:
    Description: "Id of the HostedZone"
    Value: !GetAtt HostedZoneStack.Outputs.HostedZoneId
  
