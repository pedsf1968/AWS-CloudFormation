Outputs:
  ServicesVPCEndpointServiceId:
    Description: "Returns the ID of the VPC endpoint service configuration."
    Value: !GetAtt ServicesVPCEndpointService.Outputs.VPCEndpointServiceId

  VPCEndpointServiceName:
    Value: !GetAtt ServicesVPCEndpointService.Outputs.VPCEndpointServiceName

