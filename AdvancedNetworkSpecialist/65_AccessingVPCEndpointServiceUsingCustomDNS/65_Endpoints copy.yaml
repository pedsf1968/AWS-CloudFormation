---
AWSTemplateFormatVersion: "2010-09-09"
Description:  This template create a SQS Interface Endpoint

Parameters:
  # Global parameters
  Bucket:
    Default: "hawkfund-cloudformation"
    Description: CloudFormation buket URL
    Type: String
  BucketKey:
    Default: "65_AccessingVPCEndpointServiceUsingCustomDNS"
    Description: Key to find object in the bucket
    Type: String
  BucketObject:
    Default: "Data.json"
    Description: "File to store data in the bucket"
    Type: String
  BucketRegion:
    AllowedValues: ["eu-west-3", "eu-central-1"]
    Default: "eu-west-3"
    Description: "Region where is the Bucket"
    Type: String
  EnvironmentName:
    AllowedValues: ["dev", "test", "staging", "prod"]
    ConstraintDescription: "Must specify dev, test or prod"
    Default: "dev"
    Description: "Environment name that prefix all resources"
    Type: String    
  ProjectName:
    Default: "ANS"
    Description: "Project name that prefix all resources"
    Type: String
  SaveInS3File:
    AllowedValues: [ "false", "true" ]
    Default: "false"
    Description: "Save resources information in s3 file"
    Type: String

  # Stack parameters
  AcceptanceRequired:
    AllowedValues: [ "true", "false" ]
    Default: "false"
    Description: "Indicates whether requests from service consumers to create an endpoint to your service must be accepted."
    Type: String

  # DNS Parameters
  # HostedZoneId:
  #   Description: "The ID of the hosted zone where DNS records will be created"
  #   Type: String
  HostedZoneName:
    Default: "corp.internal"
    Description: "The name of the hosted zone"
    MaxLength: 32
    Type: String
  ServiceName:
    Description: "Custom service name for DNS record (e.g., api, web, database)"
    Type: String
    Default: "app"
  RecordTTL:
    Description: "TTL for DNS records in seconds"
    Type: Number
    Default: 300
    MinValue: 60
    MaxValue: 86400

  # Infrastructure Parameters
  NetworkLoadBalancerArn:
    Description: "The Amazon Resource Names (ARNs) of the Network Load Balancers."
    Type: String
    Default: ""
  VpcEpSecurityGroupIds:
    Description: "The Security Group for VPC Endpoint."
    Type: String
  VpcEpSubnetIds:
    Type: String
  VPCEndpointId:
    Type: String

Resources:
  ServicesVPCEndpointService:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/VPC/VpcEndpointService.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        AcceptanceRequired: !Ref AcceptanceRequired
        ContributorInsightsEnabled: "true"
        NetworkLoadBalancerArn: !Ref NetworkLoadBalancerArn
        PayerResponsibility: ServiceOwner
        VpcEndpointServiceType: network

  # Route 53 Record for custom DNS name
  EndpointServiceDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: "Z0134420XFVUNDM1VBZH"
      Name: "toto.corp.internal"
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !GetAtt ServicesVPCEndpointService.Outputs.VPCEndpointServiceName

  ConsumerVPCEndpoint:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/VPC/VpcEndpoint.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        DnsRecordIpType: ipv4
        PrivateDnsEnabled: "true"
        SecurityGroupIds: !Ref VpcEpSecurityGroupIds
        ServiceName: !GetAtt ServicesVPCEndpointService.Outputs.VPCEndpointServiceName
        SubnetIds: !Ref VpcEpSubnetIds
        VpcId: !Ref VPCEndpointId
        VpcEndpointType: "Interface"

  # Custom resource to get VPC Endpoint DNS names and IPs
  VPCEndpointInfo:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:VPCEndpointDNSResolver"
      ServiceTimeout: 60
      VPCEndpointId: !GetAtt ConsumerVPCEndpoint.Outputs.VpcEndpointId
      Region: !Ref AWS::Region

  # ApplicationRecordSetStack:
