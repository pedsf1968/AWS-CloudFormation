---
AWSTemplateFormatVersion: "2010-09-09"
Description:  This template create a role for remote account to create VPC Peering

Parameters:
  # Global parameters
  Bucket:
    Default: "hawkfund-cloudformation"
    Description: CloudFormation buket URL
    Type: String
  BucketKey:
    Default: "150_AWSCloudWANNetwork"
    Description: Key to find object in the bucket
    Type: String
  BucketObject:
    Default: "Data.json"
    Description: "File to store data in the bucket"
    Type: String
  BucketRegion:
    AllowedValues: ["eu-west-3", "eu-central-1"]
    Default: "eu-west-3"
    Description: "Region where is the Bucket"
    Type: String
  EnvironmentName:
    AllowedValues: ["dev", "test", "staging", "prod"]
    ConstraintDescription: "Must specify dev, test or prod"
    Default: "dev"
    Description: "Environment name that prefix all resources"
    Type: String    
  ProjectName:
    Default: "ANS"
    Description: "Project name that prefix all resources"
    Type: String
  SaveInS3File:
    AllowedValues: [ "false", "true" ]
    Default: "true"
    Description: "Save resources information in s3 file"
    Type: String
  
  # Stack parameters
  KeyName:
    Default: "dso-paris"
    Description: "Instances Key name"
    Type: String
  InstanceElasticIPs:
    Description: "Add EIP to instances"
    Type: CommaDelimitedList
  InstanceNames:
    Description: "Instances name"
    Type: CommaDelimitedList
  InstanceTypes:
    Description: "Instances types"
    Type: CommaDelimitedList
  InstanceSecurityGroups:
    Description: "Security Groups"
    Type: CommaDelimitedList
  InstanceSubnetIds:
    Description: "Subnet IDs"
    Type: CommaDelimitedList
  VpcCount:
    Description: Number of VPCs to create
    Type: Number

Conditions:
  TwoVpcs: !Equals [ !Ref VpcCount, 2 ]

Resources:
  # Instances and Security Groups
  Instance0:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/EC2/Instance.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        AvailabilityZone: !Select [0, !GetAZs ]
        ElasticIP: !Select [0, !Ref InstanceElasticIPs]
        InstanceName: !Select [0, !Ref InstanceNames]
        InstanceType: !Select [0, !Ref InstanceTypes]
        KeyName: !Ref KeyName
        SecurityGroupIds: !Select [0, !Ref InstanceSecurityGroups]
        SubnetId: !Select [0, !Ref InstanceSubnetIds]

  Instance1:
    Type: AWS::CloudFormation::Stack
    Condition: TwoVpcs
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/EC2/Instance.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        AvailabilityZone: !Select [0, !GetAZs ]
        ElasticIP: !Select [1, !Ref InstanceElasticIPs]
        InstanceName: !Select [1, !Ref InstanceNames]
        InstanceType: !Select [1, !Ref InstanceTypes]
        KeyName: !Ref KeyName
        SecurityGroupIds: !Select [1, !Ref InstanceSecurityGroups]
        SubnetId: !Select [1, !Ref InstanceSubnetIds]

Outputs:
  InstanceIds:
    Description: "Ids of the Instances"
    Value: !If
      - TwoVpcs
      - !Join 
        - ","
        - - !GetAtt Instance0.Outputs.InstanceId
          - !GetAtt Instance1.Outputs.InstanceId
      - !GetAtt Instance0.Outputs.InstanceId
  InstancePrivateIPs:
    Description: "Private IPs of the Instances"
    Value: !If
      - TwoVpcs
      - !Join 
        - ","
        - - !GetAtt Instance0.Outputs.InstancePrivateIP
          - !GetAtt Instance1.Outputs.InstancePrivateIP
      - !GetAtt Instance0.Outputs.InstancePrivateIP
  InstancePublicIPs:
    Description: "Public IPs of the Instances"
    Value: !If
      - TwoVpcs
      - !Join 
        - ","
        - - !GetAtt Instance0.Outputs.InstancePublicIP
          - !GetAtt Instance1.Outputs.InstancePublicIP
      - !GetAtt Instance0.Outputs.InstancePublicIP