---
AWSTemplateFormatVersion: "2010-09-09"
Description:  This template create a role for remote account to create VPC Peering

Parameters:
  # Global parameters
  Bucket:
    Default: "hawkfund-cloudformation"
    Description: CloudFormation buket URL
    Type: String
  BucketKey:
    Default: "150_AWSCloudWANNetwork"
    Description: Key to find object in the bucket
    Type: String
  BucketObject:
    Default: "Data.json"
    Description: "File to store data in the bucket"
    Type: String
  BucketRegion:
    AllowedValues: ["eu-west-3", "eu-central-1"]
    Default: "eu-west-3"
    Description: "Region where is the Bucket"
    Type: String
  EnvironmentName:
    AllowedValues: ["dev", "test", "staging", "prod"]
    ConstraintDescription: "Must specify dev, test or prod"
    Default: "dev"
    Description: "Environment name that prefix all resources"
    Type: String    
  ProjectName:
    Default: "ANS"
    Description: "Project name that prefix all resources"
    Type: String
  SaveInS3File:
    AllowedValues: [ "false", "true" ]
    Default: "true"
    Description: "Save resources information in s3 file"
    Type: String

  # Stack parameters
  IgwNames:
    Default: "Default"
    Description: "Internet Gateway names"
    Type: CommaDelimitedList
  VpcIds:
    Description: "VPC IDs"
    Type: CommaDelimitedList
  VpcCount:
    Description: Number of VPCs to create
    Type: Number

Conditions:
  TwoVpcs: !Equals [ !Ref VpcCount, 2 ]

Resources:  
  # Internet Gateway and Attachment
  InternetGateway0Stack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/VPC/InternetGateway.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        Name: !Select [0, !Ref IgwNames]
        VpcId: !Select [0, !Ref VpcIds]

  InternetGateway1Stack:
    Type: AWS::CloudFormation::Stack
    Condition: TwoVpcs
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/VPC/InternetGateway.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        Name: !Select [1, !Ref IgwNames]
        VpcId: !Select [1, !Ref VpcIds]

Outputs:
  InternetGatewayIds:
    Description: "Internet Gateway IDs"
    Value: !If
      - TwoVpcs
      - !Join
        - ","
        - - !GetAtt InternetGateway0Stack.Outputs.InternetGatewayId
          - !GetAtt InternetGateway1Stack.Outputs.InternetGatewayId
      - !GetAtt InternetGateway0Stack.Outputs.InternetGatewayId
  InternetGatewayAttachmentIds:
    Description: "Internet Gateway Attachment IDs"
    Value: !If
      - TwoVpcs
      - !Join
        - ","
        - - !GetAtt InternetGateway0Stack.Outputs.InternetGatewayAttachmentId
          - !GetAtt InternetGateway1Stack.Outputs.InternetGatewayAttachmentId
      - !GetAtt InternetGateway0Stack.Outputs.InternetGatewayAttachmentId