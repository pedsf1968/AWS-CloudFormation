---
AWSTemplateFormatVersion: "2010-09-09"
Description:  This template deploys a VPC, and Subnets

Parameters:
  # Global parameters
  Bucket:
    Default: "hawkfund-cloudformation"
    Description: CloudFormation buket URL
    Type: String
  BucketKey:
    Description: Key to find object in the bucket
    Type: String
    Default: "76_TransitGatewayRestrictedRouting"
  BucketObject:
    Description: "File to store data in the bucket"
    Type: String
    Default: "Data.json"
  BucketRegion:
    AllowedValues: ["eu-west-3", "eu-central-1"]
    Default: "eu-west-3"
    Description: "Region where is the Bucket"
    Type: String
  EnvironmentName:
    AllowedValues:
      - "dev"
      - "test"
      - "prod"
    ConstraintDescription: Must specify dev, test or prod
    Default: "dev"
    Description: "Environment name that prefix all resources"
    Type: String
  ProjectName:
    Default: "ANS"
    Description: "Project name that prefix all resources"
    Type: String
  SaveInS3File:
    AllowedValues: [ "false", "true" ]
    Default: "false"
    Description: "Save resources information in s3 file"
    Type: String
  
# Stack parameters
  SubnetNames:
    Description: "Subnet names"
    Type: String
    Default: "A,B,C"
  PrivateSubnetCidrBlocks:
    Description: "Subnet CIDRs"
    Type: String
    Default: "10.0.1.0/24,10.1.1.0/24,10.2.1.0/24"
  PublicSubnetCidrBlocks:
    Description: "Subnet CIDRs"
    Type: String
    Default: "10.0.0.0/24"
  VpcCidrBlocks:
    Description: "VPC CIDRs"
    Type: String
    Default: "10.0.0.0/16,10.1.0.0/16,10.2.0.0/16"
  VpcNames:
    Description: "VPC names"
    Type: String
    Default: "A,B,C"

Resources:
  VpcAStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/VPC/Vpc.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        CidrBlock: !Select [ 0, !Split [ ",", !Ref VpcCidrBlocks ] ]
        VpcName: !Select [ 0, !Split [ ",",!Ref VpcNames ] ]

  VpcBStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/VPC/Vpc.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        CidrBlock: !Select [ 1, !Split [ ",", !Ref VpcCidrBlocks ] ]
        VpcName: !Select [ 1, !Split [ ",",!Ref VpcNames ] ]

  VpcCStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/VPC/Vpc.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        CidrBlock: !Select [ 2, !Split [ ",", !Ref VpcCidrBlocks ] ]
        VpcName: !Select [ 2, !Split [ ",",!Ref VpcNames ] ]

  PrivateSubnetAStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/VPC/Subnet.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        AvailabilityZone: !Select [ 0, !GetAZs ]
        CidrBlock: !Select [ 0, !Split [ ",", !Ref PrivateSubnetCidrBlocks]]
        MapPublicIpOnLaunch: "false"
        SubnetName: !Join [ "", [!Select [ 0, !Split [ ",", !Ref SubnetNames]], "-Private"] ]
        VpcId: !GetAtt VpcAStack.Outputs.VpcId

  PublicSubnetAStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/VPC/Subnet.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        AvailabilityZone: !Select [ 0, !GetAZs ]
        CidrBlock: !Select [ 0, !Split [ ",", !Ref PublicSubnetCidrBlocks]]
        MapPublicIpOnLaunch: "true"
        SubnetName: !Join [ "", [ !Select [ 0, !Split [ ",", !Ref SubnetNames]], "-Public"]]
        VpcId: !GetAtt VpcAStack.Outputs.VpcId

  PrivateSubnetBStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/VPC/Subnet.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        AvailabilityZone: !Select [ 1, !GetAZs ]
        CidrBlock: !Select [ 1, !Split [ ",", !Ref PrivateSubnetCidrBlocks]]
        MapPublicIpOnLaunch: "false"
        SubnetName: !Join [ "", [!Select [ 1, !Split [ ",", !Ref SubnetNames]], "-Private"] ]
        VpcId: !GetAtt VpcBStack.Outputs.VpcId

  PrivateSubnetCStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/VPC/Subnet.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        AvailabilityZone: !Select [ 2, !GetAZs ]
        CidrBlock: !Select [ 2, !Split [ ",", !Ref PrivateSubnetCidrBlocks]]
        MapPublicIpOnLaunch: "false"
        SubnetName: !Join [ "", [!Select [ 2, !Split [ ",", !Ref SubnetNames]], "-Private"] ]
        VpcId: !GetAtt VpcCStack.Outputs.VpcId

Outputs:
  VpcIds:
    Description: "VPC Ids"
    Value: !Join 
      - ","
      - - !GetAtt VpcAStack.Outputs.VpcId
        - !GetAtt VpcBStack.Outputs.VpcId
        - !GetAtt VpcCStack.Outputs.VpcId
  PrivateSubnetIds:
    Description: "Private Subnet Ids"
    Value: !Join
      - ","
      - - !GetAtt PrivateSubnetAStack.Outputs.SubnetId
        - !GetAtt PrivateSubnetBStack.Outputs.SubnetId
        - !GetAtt PrivateSubnetCStack.Outputs.SubnetId
  PublicSubnetId:
    Description: "Public Subnets Id"
    Value: !GetAtt PublicSubnetAStack.Outputs.SubnetId