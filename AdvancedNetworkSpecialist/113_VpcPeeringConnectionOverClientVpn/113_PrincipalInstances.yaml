---
AWSTemplateFormatVersion: "2010-09-09"
Description: This template generate AMI from Instance and create application Instance from the AMI

Parameters:
  # Global parameters
  Bucket:
    Default: "hawkfund-cloudformation"
    Description: CloudFormation buket URL
    Type: String
  BucketKey:
    Default: "113_VpcPeeringConnectionOverClientVpn"
    Description: Key to find object in the bucket
    Type: String
  BucketObject:
    Default: "Data.json"
    Description: "File to store data in the bucket"
    Type: String
  BucketRegion:
    AllowedValues: ["eu-west-3", "eu-central-1"]
    Default: "eu-west-3"
    Description: "Region where is the Bucket"
    Type: String
  EnvironmentName:
    AllowedValues: ["dev", "staging", "test", "prod"]
    ConstraintDescription: "Must specify dev, staging, test or prod"
    Default: "dev"
    Description: "Environment name that prefix all resources"
    Type: String
  ProjectName:
    Default: "ANS"
    Description: "Project name that prefix all resources"
    Type: String
  SaveInS3File:
    AllowedValues: ["false", "true"]
    Default: "false"
    Description: "Save resources information in s3 file"
    Type: String

  # Stack parameters
  ClientBaseName:
    AllowedPattern: "^[a-zA-Z0-9._-]+$"
    ConstraintDescription: "Must contain only alphanumeric characters, periods, hyphens, and underscores"
    Default: "client1"
    Description: "Default client certificate base name"
    MaxLength: 64
    MinLength: 1
    Type: String
  DomainName:
    AllowedPattern: "^[a-zA-Z0-9.-]+$"
    ConstraintDescription: "Must be a valid domain name"
    Default: "domain.kr"
    Description: "Base domain name for certificates"
    MaxLength: 253
    MinLength: 4
    Type: String
  KeyName:
    Default: "dso-paris"
    Description: "Instances Key name"
    Type: String
  ServerBaseName:
    AllowedPattern: "^[a-zA-Z0-9._-]+$"
    ConstraintDescription: "Must contain only alphanumeric characters, periods, hyphens, and underscores"
    Default: "application"
    Description: "The full name of the server certificate"
    MaxLength: 64
    MinLength: 1
    Type: String
  RootCaBaseName:
    AllowedPattern: "^[a-zA-Z0-9._-]+$"
    ConstraintDescription: "Must contain only alphanumeric characters, periods, hyphens, and underscores"
    Default: "root-ca"
    Description: "The name of the CA certificate"
    MaxLength: 64
    MinLength: 1
    Type: String

  # Bastion parameters
  BastionInstanceName:
    Default: "bastion"
    Description: "Bastion Instances name"
    Type: String
  BastionInstanceProfile:
    Description: "Profile of the Application"
    Type: String
  BastionInstanceType:
    Default: t3a.micro
    Description: "Bastion Instances type"
    Type: String
  BastionInstanceSecurityGroup:
    Description: "Bastion Security Group"
    Type: String
  BastionInstanceSubnetId:
    Description: "Bastion Subnet ID"
    Type: String

  CaServerInstanceName:
    Default: "ca"
    Description: "CA Instance name"
    Type: String
  CaServerInstanceProfile:
    Description: "Profile of the CA"
    Type: String
  CaServerInstanceType:
    Default: t3a.nano
    Description: "CA Instance type"
    Type: String
  CaServerInstanceSecurityGroup:
    Description: "CA Security Group"
    Type: String
  CaServerInstanceSubnetId:
    Description: "CA Subnet ID"
    Type: String

  # EasyRSA parameters
  CertificatesDirectory:
    Default: "/opt/certificates"
    Description: "Directory for certificates"
    Type: "String"
  InstallDirectory:
    Default: "/opt"
    Description: "Working directory for installation"
    Type: String
  LogDirectory:
    Default: "/var/log/easy-rsa"
    Description: "Log directory path"
    Type: String

Resources:
  # Bastion Instance
  BastionInstance:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/EC2/Instance.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        AvailabilityZone: !Select [0, !GetAZs ]
        IamInstanceProfile: !Ref BastionInstanceProfile
        ElasticIP: "true"
        InstanceName: !Ref BastionInstanceName
        InstanceType: !Ref BastionInstanceType
        KeyName: !Ref KeyName
        SecurityGroupIds: !Ref BastionInstanceSecurityGroup
        SubnetId: !Ref BastionInstanceSubnetId

  # Application Instance
  CaInstance:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/EC2/Instance.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        AvailabilityZone: !Select [0, !GetAZs ]
        IamInstanceProfile: !Ref CaServerInstanceProfile
        InstanceName: !Ref CaServerInstanceName
        InstanceType: !Ref CaServerInstanceType
        KeyName: !Ref KeyName
        SecurityGroupIds: !Ref CaServerInstanceSecurityGroup
        SubnetId: !Ref CaServerInstanceSubnetId

  EasyRsaInstallerSsmAssociation:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/SSM/EasyRsaInstallerSsmAssociation.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        BucketRegion: !Ref BucketRegion
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File

        CertificatesDirectory: !Ref CertificatesDirectory
        InstallDirectory: !Ref InstallDirectory
        InstanceId: !GetAtt CaInstance.Outputs.InstanceId
        LogDirectory: !Ref LogDirectory
        OutputS3BucketName: !Ref Bucket

  EasyRsaCACertificateSsmAssociation:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    DependsOn:
      - EasyRsaInstallerSsmAssociation
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/SSM/EasyRsaCACertificateSsmAssociation.yaml"
      TimeoutInMinutes: 10
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        BucketRegion: !Ref BucketRegion
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        DomainName: !Ref DomainName
        InstallDirectory: !Ref InstallDirectory
        InstanceId: !GetAtt CaInstance.Outputs.InstanceId
        LogDirectory: !Ref LogDirectory
        OutputS3BucketName: !Ref Bucket
        RootCaBaseName: !Ref RootCaBaseName

  EasyRsaServerCertificateSsmAssociation:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    DependsOn:
      - EasyRsaInstallerSsmAssociation
      - EasyRsaCACertificateSsmAssociation
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/SSM/EasyRsaServerCertificateSsmAssociation.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        BucketRegion: !Ref BucketRegion
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        DomainName: !Ref DomainName
        InstallDirectory: !Ref InstallDirectory
        InstanceId: !GetAtt CaInstance.Outputs.InstanceId
        LogDirectory: !Ref LogDirectory
        OutputS3BucketName: !Ref Bucket
        RootCaBaseName: !Ref RootCaBaseName
        ServerBaseName: !Ref ServerBaseName

  # EasyRsaClientCertificateSsmAssociation:
  #   Type: AWS::CloudFormation::Stack
  #   DeletionPolicy: Delete
  #   DependsOn:
  #     - EasyRsaInstallerSsmAssociation
  #     - EasyRsaCACertificateSsmAssociation
  #     - EasyRsaServerCertificateSsmAssociation
  #   UpdateReplacePolicy: Delete
  #   Properties:
  #     TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/SSM/EasyRsaClientCertificateSsmAssociation.yaml"
  #     TimeoutInMinutes: 5
  #     Parameters:
  #       Bucket: !Ref Bucket
  #       BucketKey: !Ref BucketKey
  #       BucketObject: !Ref BucketObject
  #       BucketRegion: !Ref BucketRegion
  #       EnvironmentName: !Ref EnvironmentName
  #       ProjectName: !Ref ProjectName
  #       SaveInS3File: !Ref SaveInS3File
  #       ClientBaseName: !Ref ClientBaseName
  #       DomainName: !Ref DomainName
  #       InstanceId: !GetAtt CaInstance.Outputs.InstanceId
  #       OutputS3BucketName: !Ref Bucket

Outputs:
  BastionInstanceId:
    Description: "Id of the Bastion Instance"
    Value: !GetAtt BastionInstance.Outputs.InstanceId
  BastionPrivateIP:
    Description: "Private IP of the Bastion Instance"
    Value: !GetAtt BastionInstance.Outputs.InstancePrivateIP
  BastionPublicIP:
    Description: "Public IP of the Bastion Instance"
    Value: !GetAtt BastionInstance.Outputs.InstancePublicIP

  CaInstanceId:
    Description: "CA Instance ID"
    Value: !GetAtt CaInstance.Outputs.InstanceId
  CaInstancePrivateIP:
    Description: "CA Instance IP"
    Value: !GetAtt CaInstance.Outputs.InstancePrivateIP