---
AWSTemplateFormatVersion: "2010-09-09"
Description: This template generate AMI from Instance and create application Instance from the AMI

Parameters:
  # Global parameters
  Bucket:
    Default: "hawkfund-cloudformation"
    Description: CloudFormation buket URL
    Type: String
  BucketKey:
    Default: "113_VpcPeeringConnectionOverClientVpn"
    Description: Key to find object in the bucket
    Type: String
  BucketObject:
    Default: "Data.json"
    Description: "File to store data in the bucket"
    Type: String
  BucketRegion:
    AllowedValues: ["eu-west-3", "eu-central-1"]
    Default: "eu-west-3"
    Description: "Region where is the Bucket"
    Type: String
  EnvironmentName:
    AllowedValues: ["dev", "staging", "test", "prod"]
    ConstraintDescription: "Must specify dev, staging, test or prod"
    Default: "dev"
    Description: "Environment name that prefix all resources"
    Type: String
  ProjectName:
    Default: "ANS"
    Description: "Project name that prefix all resources"
    Type: String
  SaveInS3File:
    AllowedValues: ["false", "true"]
    Default: "false"
    Description: "Save resources information in s3 file"
    Type: String

  # Stack parameters
  KeyName:
    Default: "dso-paris"
    Description: "Instances Key name"
    Type: String

  FirstRegion:
    Description: Region of the first AWS Account for VPC peering
    Type: String
    Default: eu-west-3
  SecondRegion:
    Description: Region of the second AWS Account for VPC peering
    Type: String
    Default: eu-central-1

  # Application parameters
  ApplicationInstanceImageId:
    Default: "ami-0a6793a25df710b06 "
    Description: "Web Server AMI"
    Type: AWS::EC2::Image::Id
  ApplicationInstanceName:
    Default: "application"
    Description: "Application Instances name"
    Type: String
  ApplicationInstanceType:
    Default: t3a.micro
    Description: "Application Instances type"
    Type: String
  ApplicationInstanceSecurityGroup:
    Description: "Application Security Group"
    Type: String
  ApplicationInstanceSubnetId:
    Description: "Application Subnet ID"
    Type: String

Resources:
  GetApplicationInstanceProfile:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !Join [":", ["arn:aws:lambda", !Ref AWS::Region, !Ref AWS::AccountId, "function:GetParametersFromS3"]]
      ServiceTimeout: 60
      Bucket: !Ref Bucket
      BucketKey: !Ref BucketKey
      BucketObject: !Ref BucketObject
      Key: !Sub "${PeerRegion}:${ProjectName}:${EnvironmentName}:IAM:InstanceProfile:application-Instance-Profile:Arn"
      Delay: 30
      DelayCount: 3

  # Application Instance
  ApplicationInstance:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/EC2/Instance.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        AvailabilityZone: !Select [0, !GetAZs ]
        IamInstanceProfile: !GetAtt GetApplicationInstanceProfile.Value
        ImageId: !Ref ApplicationInstanceImageId
        InstanceName: !Ref ApplicationInstanceName
        InstanceType: !Ref ApplicationInstanceType
        KeyName: !Ref KeyName
        SecurityGroupIds: !Ref ApplicationInstanceSecurityGroup
        SubnetId: !Ref ApplicationInstanceSubnetId

Outputs:
  ApplicationInstanceId:
    Description: "Application Instances ID"
    Value: !GetAtt ApplicationInstance.Outputs.InstanceId
  ApplicationInstancePrivateIP:
    Description: "Application Instance IP"
    Value: !GetAtt ApplicationInstance.Outputs.InstancePrivateIP

