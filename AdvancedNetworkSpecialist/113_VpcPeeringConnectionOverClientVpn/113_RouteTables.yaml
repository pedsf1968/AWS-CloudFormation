---
AWSTemplateFormatVersion: "2010-09-09"
Description:  This template create Tables and Route Tables

Parameters:
  # Global parameters
  Bucket:
    Default: "hawkfund-cloudformation"
    Description: CloudFormation buket URL
    Type: String
  BucketKey:
    Default: "113_VpcPeeringConnectionOverClientVpn"
    Description: Key to find object in the bucket
    Type: String
  BucketObject:
    Default: "Data.json"
    Description: "File to store data in the bucket"
    Type: String
  BucketRegion:
    AllowedValues: ["eu-west-3", "eu-central-1"]
    Default: "eu-west-3"
    Description: "Region where is the Bucket"
    Type: String
  EnvironmentName:
    AllowedValues: ["dev", "staging", "test", "prod"]
    ConstraintDescription: "Must specify dev, staging, test or prod"
    Default: "dev"
    Description: "Environment name that prefix all resources"
    Type: String
  ProjectName:
    Default: "ANS"
    Description: "Project name that prefix all resources"
    Type: String
  SaveInS3File:
    AllowedValues: ["false", "true"]
    Default: "false"
    Description: "Save resources information in s3 file"
    Type: String
  
  # Route parameters
  InternetGatewayId:
    Description: "Internet Gateway ID"
    Type: String
  NatGatewayId:
    Description: "NAT Gateway ID"
    Type: String

  PublicSubnetId:
    Description: "Public Subnets ID for VPC"
    Type: String
  PublicSubnetRouteTableName:
    Description: "Public Subnet Route Tables name"
    Type: String
  SecureSubnetId:
    Description: "Secure Subnets ID"
    Type: String
  SecureSubnetRouteTableName:
    Description: "Secure Subnet Route Tables name"
    Type: String
  PrivateSubnetId:
    Description: "Private Subnets ID"
    Type: String
  PrivateSubnetRouteTableName:
    Description: "Private Subnet Route Tables name"
    Type: String
  VpcId:
    Description: "VPC ID"
    Type: String

Resources:
  # Route, Route Table and Associations
  PublicSubnetRouteTableStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/VPC/RouteTable.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        RouteTableName: !Join ["-", [!Ref PublicSubnetRouteTableName, "RT"]]
        SubnetId: !Ref PublicSubnetId
        VpcId: !Ref VpcId

  PublicSubnetRouteStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/VPC/Route.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        DestinationCidrBlock: "0.0.0.0/0"
        RouteTableId: !GetAtt PublicSubnetRouteTableStack.Outputs.RouteTableId
        RouteTableName: !Ref PublicSubnetRouteTableName
        TargetType: "InternetGateway"
        TargetId: !Ref InternetGatewayId

  SecureSubnetRouteTableStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/VPC/RouteTable.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        RouteTableName: !Join ["-", [!Ref SecureSubnetRouteTableName, "RT"]]
        SubnetId: !Ref SecureSubnetId
        VpcId: !Ref VpcId

  SecureSubnetRouteStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/VPC/Route.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        DestinationCidrBlock: "0.0.0.0/0"
        RouteTableId: !GetAtt SecureSubnetRouteTableStack.Outputs.RouteTableId
        RouteTableName: !Ref SecureSubnetRouteTableName
        TargetType: "NatGateway"
        TargetId: !Ref NatGatewayId

  PrivateSubnetRouteTableStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/VPC/RouteTable.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        RouteTableName: !Join ["-", [!Ref PrivateSubnetRouteTableName, "RT"]]
        SubnetId: !Ref PrivateSubnetId
        VpcId: !Ref VpcId

  PrivateSubnetRouteStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${Bucket}.s3.${BucketRegion}.amazonaws.com/Generic/VPC/Route.yaml"
      TimeoutInMinutes: 5
      Parameters:
        Bucket: !Ref Bucket
        BucketKey: !Ref BucketKey
        BucketObject: !Ref BucketObject
        EnvironmentName: !Ref EnvironmentName
        ProjectName: !Ref ProjectName
        SaveInS3File: !Ref SaveInS3File
        DestinationCidrBlock: "0.0.0.0/0"
        RouteTableId: !GetAtt PrivateSubnetRouteTableStack.Outputs.RouteTableId
        RouteTableName: !Ref PrivateSubnetRouteTableName
        TargetType: "NatGateway"
        TargetId: !Ref NatGatewayId

Outputs:
  PublicSubnetRouteId:
    Description: "Public Subnet Route ID"
    Value: !GetAtt PublicSubnetRouteStack.Outputs.RouteId
  PublicSubnetRouteTableAssociationId:
    Description: "Public Route Table Association ID"
    Value: !GetAtt PublicSubnetRouteTableStack.Outputs.SubnetRouteTableAssociationId
  PublicSubnetRouteTableId:
    Description: "Public Subnet Route Table ID"
    Value: !GetAtt PublicSubnetRouteTableStack.Outputs.RouteTableId

  SecureSubnetRouteId:
    Description: "Secure Subnet Route ID"
    Value: !GetAtt SecureSubnetRouteStack.Outputs.RouteId
  SecureSubnetRouteTableAssociationId:
    Description: "Secure Route Table Association ID"
    Value: !GetAtt SecureSubnetRouteTableStack.Outputs.SubnetRouteTableAssociationId
  SecureSubnetRouteTableId:
    Description: "Secure Subnet Route Table ID"
    Value: !GetAtt SecureSubnetRouteTableStack.Outputs.RouteTableId

  PrivateSubnetRouteId:
    Description: "Private Subnet Route ID"
    Value: !GetAtt PrivateSubnetRouteStack.Outputs.RouteId
  PrivateSubnetRouteTableAssociationId:
    Description: "Private Route Table Association ID"
    Value: !GetAtt PrivateSubnetRouteTableStack.Outputs.SubnetRouteTableAssociationId
  PrivateSubnetRouteTableId:
    Description: "Private Subnet Route Table ID"
    Value: !GetAtt PrivateSubnetRouteTableStack.Outputs.RouteTableId